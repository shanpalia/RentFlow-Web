name: Load RentFlow final UI fixes

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add final fixes script to index
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -q 'rentflow-final-fixes.js' index.html; then
            python3 - <<'PY'
from pathlib import Path
p = Path('index.html')
s = p.read_text(encoding='utf-8')
needle = '</body>'
insert = '<script src="rentflow-final-fixes.js"></script>\n'
if needle not in s:
    raise SystemExit('Could not find </body> in index.html')
s = s.replace(needle, insert + needle, 1)
p.write_text(s, encoding='utf-8')
PY
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add index.html
            git commit -m 'fix: load final RentFlow UI fixes'
            git push
          else
            echo 'Final fixes script is already loaded.'
          fi
