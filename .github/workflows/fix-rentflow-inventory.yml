name: Fix RentFlow Inventory

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply safe inventory patch
        shell: python
        run: |
          from pathlib import Path
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")

          s = s.replace("max-width:1600px", "max-width:none;width:100%")
          s = s.replace("width:min(900px,100%)", "width:min(1100px,100%)")

          old_form_start = "function itemForm(id){"
          old_form_end = "function customerForm"
          a = s.find(old_form_start)
          b = s.find(old_form_end, a)
          if a < 0 or b < 0:
              raise SystemExit("itemForm not found")

          new_form = """function itemForm(id){const old=item(id)||{name:'',code:'',category:'General',qty:0,price:0,rent:15};openModal(`<div class="modalhead"><h2>${id?'Edit':'Add'} Inventory Item</h2><button class="close" data-action="close">×</button></div><div class="form"><div class="field"><label>Item Name *</label><input id="fName" value="${esc(old.name)}"></div><div class="field"><label>Item Code</label><input id="fCode" value="${esc(old.code)}"></div><div class="field"><label>Category</label><input id="fCat" value="${esc(old.category||'General')}"></div><div class="field"><label>Quantity *</label><input id="fQty" type="number" min="0" value="${old.qty??0}"></div><div class="field"><label>Item Price</label><input id="fPrice" type="number" min="0" step="0.01" value="${old.price??0}"></div><div class="field"><label>Rent per Day</label><input id="fRent" type="number" min="0" step="0.01" value="${old.rent??15}"></div><div class="full toolbar"><button class="btn primary" data-action="save-item:${id||''}">Save Item</button><button class="btn ghost" data-action="close">Cancel</button></div></div>`)}

"""
          s = s[:a] + new_form + s[b:]

          s = s.replace("qty:0,openingQty:0,rent:15", "qty:0,price:0,rent:15")
          s = s.replace("Rent per 100 Days", "Rent per Day")
          s = s.replace("Rent/100", "Rent/Day")
          s = s.replace("qty*days*rent/100", "qty*days*rent")
          s = s.replace("Number(old?.rent||0)*q.qty*Number(old?.days||1)/100", "Number(old?.rent||0)*q.qty*Number(old?.days||1)")
          s = s.replace("Number(r.querySelector('.inv-qty').value||0)*Number(r.querySelector('.inv-days').value||0)*Number(r.querySelector('.inv-rent').value||0)/100",
                        "Number(r.querySelector('.inv-qty').value||0)*Number(r.querySelector('.inv-days').value||0)*Number(r.querySelector('.inv-rent').value||0)")
          s = s.replace("Opening Qty</th><th>Current Qty</th>", "Quantity</th>")
          s = s.replace("Opening Quantity", "Quantity")
          s = s.replace("Current Quantity", "Quantity")

          save_start = "function saveItem(id){"
          save_end = "function saveCustomer"
          c = s.find(save_start)
          d = s.find(save_end, c)
          if c < 0 or d < 0:
              raise SystemExit("saveItem not found")

          new_save = """function saveItem(id){const name=document.getElementById('fName').value.trim();if(!name)return alert('Item name is required.');const old=item(id);const x={id:id||uid(),name,code:document.getElementById('fCode').value.trim(),category:document.getElementById('fCat').value.trim()||'General',qty:Number(document.getElementById('fQty').value||0),price:Number(document.getElementById('fPrice').value||0),rent:Number(document.getElementById('fRent').value||0)};if(old)Object.assign(old,x);else data.items.push(x);closeModal();save();go('inventory')}

"""
          s = s[:c] + new_save + s[d:]

          if "Opening Quantity" in s or "Current Quantity" in s:
              raise SystemExit("Old quantity labels remain")
          if "Rent per Day" not in s:
              raise SystemExit("Rent per Day missing")
          if "function saveItem(id)" not in s:
              raise SystemExit("saveItem missing")
          p.write_text(s, encoding="utf-8")

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "fix: inventory quantity and daily rent"
            git push
          fi