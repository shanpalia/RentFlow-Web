name: Repair RentFlow Company
on:
  push:
    paths:
      - 'rentflow-company-repair.js'
      - '.github/workflows/repair-company.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Inject repair script into index
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="rentflow-company-repair.js"></script>'
          if tag not in s:
              marker='</body>'
              if marker not in s:
                  raise SystemExit('index.html: </body> not found')
              s=s.replace(marker, tag+'\n'+marker, 1)
              p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html rentflow-company-repair.js .github/workflows/repair-company.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: repair RentFlow company master'
          git push