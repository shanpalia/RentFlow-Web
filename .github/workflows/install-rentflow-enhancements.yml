name: Install RentFlow form enhancements
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Add enhancement scripts to index
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tags=[
              '<script src="rentflow-enhancements.js"></script>',
              '<script src="rentflow-final-fixes.js"></script>'
          ]
          marker='</body>'
          if marker not in s:
              raise SystemExit('index.html: </body> not found')
          for tag in tags:
              if tag not in s:
                  s=s.replace(marker, tag+'\n'+marker, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix: enable RentFlow final UI fixes"
          git push
