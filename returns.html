<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="favicon.svg" type="image/svg+xml"><meta name="theme-color" content="#008f78"><title>Returns / Receive • RentFlow</title><style>
:root{--e:#008f78;--ed:#006b59;--es:#e8f7f3;--bg:#f4f8f7;--ink:#17221f;--muted:#71807c;--line:#d9e5e2;--card:#fff;--danger:#c62828}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px Arial,system-ui,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.top{height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 24px;position:fixed;top:0;left:0;right:0;z-index:5}.brand{font-size:20px;font-weight:900}.layout{padding-top:64px;min-height:100vh}.side{position:fixed;top:64px;bottom:0;width:260px;background:#fff;border-right:1px solid var(--line);padding:14px;overflow:auto}.nav button{display:block;width:100%;border:0;background:transparent;text-align:left;padding:13px;border-radius:10px;font-weight:800;margin:4px 0}.nav button:hover,.nav button.active{background:var(--es);color:var(--ed)}.content{margin-left:260px;padding:28px;min-height:calc(100vh - 64px)}.page-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.page-title h1{margin:0;font-size:28px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;margin-bottom:18px}.form{display:grid;grid-template-columns:1fr 1fr;gap:16px}.full{grid-column:1/-1}.field label{display:block;font-size:12px;font-weight:900;margin-bottom:7px}.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:9px;background:#fff}.section{font-size:18px;font-weight:900;margin:4px 0 14px}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:10px}table{width:100%;border-collapse:collapse;background:#fff}th,td{padding:13px 12px;border-bottom:1px solid var(--line);text-align:left}th{background:#f7faf9;font-size:11px;color:var(--muted);text-transform:uppercase}tr:last-child td{border-bottom:0}.btn{border:0;border-radius:9px;padding:11px 15px;font-weight:800}.primary{background:var(--e);color:#fff}.secondary{background:var(--es);color:var(--ed)}.ghost{background:#fff;border:1px solid var(--line)}.danger{background:#fff0f0;color:var(--danger)}.actions{display:flex;gap:10px;align-items:center;margin-top:16px}.spacer{flex:1}.empty{text-align:center;padding:38px;color:var(--muted)}.total{font-size:22px;font-weight:900}.note{color:var(--muted);font-size:12px;margin-top:8px}@media(max-width:900px){.side{display:none}.content{margin-left:0;padding:18px 14px}.form{grid-template-columns:1fr}.full{grid-column:auto}}
</style></head><body><header class="top"><div class="brand">RentFlow <span style="color:var(--muted)">• PaliaAPK HUB</span></div></header><div class="layout"><aside class="side"><nav class="nav"><button onclick="location.href='index.html'">⌂ &nbsp; Dashboard</button><button onclick="location.href='inventory.html'">▦ &nbsp; Inventory / Items</button><button onclick="location.href='customers.html'">♙ &nbsp; Customers / Parties</button><button onclick="location.href='issued.html'">↗ &nbsp; Issued / New Invoice</button><button class="active">↩ &nbsp; Returns / Receive</button><button onclick="location.href='register.html'">▤ &nbsp; Inventory Register</button><button onclick="location.href='reports.html'">▧ &nbsp; Reports / Bills</button><button onclick="location.href='company.html'">⌂ &nbsp; Company</button><button onclick="location.href='settings.html'">⚙ &nbsp; Settings / About</button></nav><div style="color:var(--muted);font-size:12px;margin:20px 8px">By PaliaAPK HUB<br>Developer by shanpalia</div></aside><main class="content"><div class="page-title"><h1>Returns / Receive</h1><button class="btn ghost" onclick="location.href='index.html'">← Dashboard</button></div><div class="card"><div class="form"><div class="field"><label>Return No.</label><input id="returnNo" readonly></div><div class="field"><label>Return Date</label><input id="returnDate" type="date"></div><div class="field"><label>Party *</label><select id="customer"><option value="">Select party</option></select></div><div class="field"><label>Issued Invoice *</label><select id="invoice"><option value="">Select issued invoice</option></select></div></div></div><div class="card"><div class="section">Return Inventory</div><div class="tablewrap"><table><thead><tr><th>Srl</th><th>Item</th><th>Unit</th><th>Issued Qty</th><th>Return Qty</th><th>Rent / Day</th><th>Rent Days</th><th>Return Amount</th></tr></thead><tbody id="rows"></tbody></table><div id="empty" class="empty">Select an issued invoice to load inventory.</div></div><div class="actions"><div class="spacer"></div><div class="total" id="total">Total ₹0.00</div></div></div><div class="card"><div class="form"><div class="field full"><label>Notes</label><textarea id="notes" rows="3" placeholder="Optional return notes"></textarea></div></div><div class="actions"><button class="btn ghost" onclick="location.href='index.html'">Cancel</button><div class="spacer"></div><button class="btn primary" onclick="saveReturn()">Save Return & Receipt</button></div></div></main></div><script>
const KEY='rentflow_web_v6';function load(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return{}}}let data=load();data.items=Array.isArray(data.items)?data.items:[];data.customers=Array.isArray(data.customers)?data.customers:[];data.issues=Array.isArray(data.issues)?data.issues:[];data.returns=Array.isArray(data.returns)?data.returns:[];data.shop=data.shop||{};const id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);const money=v=>(data.settings?.currency||'₹')+Number(v||0).toFixed(2);document.getElementById('returnNo').value=(data.shop.invoicePrefix||'RET')+'-RET-'+String(data.returns.length+1).padStart(4,'0');document.getElementById('returnDate').value=new Date().toISOString().slice(0,10);function refreshCustomers(){customer.innerHTML='<option value="">Select party</option>'+data.customers.map(x=>`<option value="${x.id}">${x.name}${x.mobile?' • '+x.mobile:''}</option>`).join('')}function refreshInvoices(){let c=customer.value;invoice.innerHTML='<option value="">Select issued invoice</option>'+data.issues.filter(x=>!c||String(x.customerId)===String(c)).map(x=>`<option value="${x.id}">${x.invoice} • ${x.date}</option>`).join('')}customer.onchange=()=>{refreshInvoices();clearRows()};invoice.onchange=loadIssue;function clearRows(){rows.innerHTML='';empty.style.display='block';total.textContent='Total '+money(0)}function loadIssue(){let issue=data.issues.find(x=>String(x.id)===String(invoice.value));rows.innerHTML='';if(!issue){clearRows();return}empty.style.display='none';(issue.items||[]).forEach((x,i)=>{let tr=document.createElement('tr');let original=Number(x.qty||0);let already=data.returns.flatMap(r=>r.items||[]).filter(r=>String(r.issueId)===String(issue.id)&&String(r.itemId)===String(x.itemId)).reduce((n,r)=>n+Number(r.returnQty||0),0);let remaining=Math.max(0,original-already);tr.innerHTML=`<td>${i+1}</td><td><b>${x.name||''}</b></td><td>${x.unit||'Pcs'}</td><td>${remaining}</td><td><input class="rqty" type="number" min="0" max="${remaining}" value="0" style="width:90px;padding:9px;border:1px solid var(--line);border-radius:8px"></td><td>${money(x.rent)}</td><td>${x.days||1}</td><td class="amount">${money(0)}</td>`;tr.dataset.itemId=x.itemId;tr.dataset.rent=x.rent||0;tr.dataset.days=x.days||1;tr.querySelector('.rqty').oninput=calc;rows.appendChild(tr)})}function calc(){let sum=0;document.querySelectorAll('#rows tr').forEach(tr=>{let q=Number(tr.querySelector('.rqty').value)||0,r=Number(tr.dataset.rent)||0,d=Number(tr.dataset.days)||1,a=q*r*d;tr.querySelector('.amount').textContent=money(a);sum+=a});total.textContent='Total '+money(sum)}function saveReturn(){let issue=data.issues.find(x=>String(x.id)===String(invoice.value));if(!issue)return alert('Please select an issued invoice.');let out=[];document.querySelectorAll('#rows tr').forEach(tr=>{let q=Number(tr.querySelector('.rqty').value)||0;if(q>0)out.push({issueId:issue.id,itemId:tr.dataset.itemId,name:tr.cells[1].innerText,returnQty:q,rent:Number(tr.dataset.rent)||0,days:Number(tr.dataset.days)||1,amount:q*(Number(tr.dataset.rent)||0)*(Number(tr.dataset.days)||1)})});if(!out.length)return alert('Enter Return Qty for at least one item.');out.forEach(x=>{let item=data.items.find(i=>String(i.id)===String(x.itemId));if(item)item.qty=Number(item.qty||0)+x.returnQty});let amount=out.reduce((n,x)=>n+x.amount,0);data.returns.push({id:id(),returnNo:returnNo.value,date:returnDate.value,customerId:customer.value,issueId:issue.id,issueInvoice:issue.invoice,items:out,amount,notes:notes.value.trim()});localStorage.setItem(KEY,JSON.stringify(data));alert('Return saved successfully. Inventory has been restored.');location.href='index.html'}refreshCustomers();
</script></body></html>
