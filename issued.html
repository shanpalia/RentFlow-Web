<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="favicon.svg" type="image/svg+xml"><meta name="theme-color" content="#008f78"><title>Issued / New Invoice • RentFlow</title><style>body{margin:0;background:#f4f8f7;color:#17221f;font:14px Arial,sans-serif}button,input,select{font:inherit}button{cursor:pointer}.top{height:64px;background:#fff;border-bottom:1px solid #d9e5e2;display:flex;align-items:center;padding:0 24px;position:fixed;top:0;left:0;right:0;z-index:5}.brand{font-size:20px;font-weight:900}.side{position:fixed;top:64px;bottom:0;width:260px;background:#fff;border-right:1px solid #d9e5e2;padding:14px}.nav button{display:block;width:100%;border:0;background:transparent;text-align:left;padding:13px;border-radius:10px;font-weight:800;margin:4px 0}.nav button:hover,.nav button.active{background:#e8f7f3;color:#006b59}.content{margin-left:260px;padding:92px 28px 28px;min-height:100vh}.title{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.title h1{margin:0;font-size:28px}.card{background:#fff;border:1px solid #d9e5e2;border-radius:14px;padding:22px;margin-bottom:18px}.meta{display:grid;grid-template-columns:1fr 1fr 2fr;gap:16px}.field label{display:block;font-size:12px;font-weight:900;margin-bottom:7px}.field input,.field select{width:100%;padding:12px;border:1px solid #d9e5e2;border-radius:9px;background:#fff}.party{display:flex;gap:8px;align-items:end}.party .field{flex:1}.btn{border:0;border-radius:9px;padding:11px 15px;font-weight:800}.primary{background:#008f78;color:#fff}.secondary{background:#e8f7f3;color:#006b59}.ghost{background:#fff;border:1px solid #d9e5e2}.danger{background:#fff0f0;color:#c62828}.section{font-size:18px;font-weight:900;margin-bottom:14px}.tablewrap{overflow:auto;border:1px solid #d9e5e2;border-radius:10px}table{width:100%;border-collapse:collapse}th,td{padding:13px 12px;border-bottom:1px solid #d9e5e2;text-align:left}th{background:#f7faf9;font-size:11px;color:#71807c;text-transform:uppercase}.item{min-width:280px}.qty{width:130px}.actions{display:flex;gap:10px;align-items:center;margin-top:16px}.spacer{flex:1}.empty{text-align:center;padding:35px;color:#71807c}.modal{position:fixed;inset:0;background:#17221f73;display:none;place-items:center;z-index:30;padding:20px}.modal.open{display:grid}.modal-card{background:#fff;border-radius:18px;padding:24px;width:min(620px,100%)}.form{display:grid;grid-template-columns:1fr 1fr;gap:14px}.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}@media(max-width:900px){.side{display:none}.content{margin-left:0;padding:84px 14px 18px}.meta,.form{grid-template-columns:1fr}}@media(max-width:600px){.title h1{font-size:22px}}</style></head><body><header class="top"><div class="brand">RentFlow <span style="color:#71807c">• PaliaAPK HUB</span></div></header><aside class="side"><nav class="nav"><button onclick="location.href='index.html'">⌂ &nbsp; Dashboard</button><button onclick="location.href='inventory.html'">▦ &nbsp; Inventory / Items</button><button onclick="location.href='customers.html'">♙ &nbsp; Customers / Parties</button><button class="active">↗ &nbsp; Issued / New Invoice</button><button onclick="location.href='returns.html'">↩ &nbsp; Returns / Receive</button><button onclick="location.href='register.html'">▤ &nbsp; Inventory Register</button><button onclick="location.href='reports.html'">▧ &nbsp; Reports / Bills</button><button onclick="location.href='company.html'">⌂ &nbsp; Company</button><button onclick="location.href='settings.html'">⚙ &nbsp; Settings / About</button><button onclick="exitRentFlow()">⏻ &nbsp; Exit / Change Company</button></nav><div style="color:#71807c;font-size:12px;margin:20px 8px">By PaliaAPK HUB<br>Developer by shanpalia</div></aside><main class="content"><div class="title"><h1>Issued / New Invoice</h1><button class="btn ghost" onclick="location.href='index.html'">← Dashboard</button></div><div class="card"><div class="meta"><div class="field"><label>Invoice No.</label><input id="invoiceNo" readonly></div><div class="field"><label>Date</label><input id="date" type="date"></div><div class="party"><div class="field"><label>Party *</label><select id="customer"><option value="">Select party</option></select></div><button class="btn primary" type="button" onclick="openParty()">＋</button></div></div></div><div class="card"><div class="section">Inventory</div><div class="tablewrap"><table><thead><tr><th style="width:80px">Srl</th><th>Item</th><th style="width:180px">Unit</th><th style="width:180px">Qty</th><th style="width:70px"></th></tr></thead><tbody id="rows"></tbody></table><div id="empty" class="empty">No item added. Click “Add Item”.</div></div><div class="actions"><button class="btn secondary" type="button" onclick="addRow()">＋ Add Item</button><div class="spacer"></div><button class="btn primary" type="button" onclick="saveIssue()">Save Issue</button></div></div></main><div class="modal" id="partyModal"><div class="modal-card"><h2 style="margin-top:0">Add Customer / Party</h2><div class="form"><div class="field"><label>Name *</label><input id="pname"></div><div class="field"><label>Mobile</label><input id="pmobile"></div><div class="field"><label>Email</label><input id="pemail"></div><div class="field"><label>Address</label><input id="paddress"></div></div><div class="modal-actions"><button class="btn ghost" onclick="closeParty()">Cancel</button><button class="btn primary" onclick="saveParty()">Save Party</button></div></div></div><script>const KEY='rentflow_web_v6';function load(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return {}}}let data=load();data.items=Array.isArray(data.items)?data.items:[];data.customers=Array.isArray(data.customers)?data.customers:[];data.issues=Array.isArray(data.issues)?data.issues:[];data.shop=data.shop||{};const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);function nextInvoice(){return (data.shop.invoicePrefix||'INV')+'-'+String(data.issues.length+1).padStart(4,'0')}document.getElementById('invoiceNo').value=nextInvoice();document.getElementById('date').value=new Date().toISOString().slice(0,10);function refreshParties(){document.getElementById('customer').innerHTML='<option value="">Select party</option>'+data.customers.map(x=>`<option value="${x.id}">${esc(x.name)}${x.mobile?' • '+esc(x.mobile):''}</option>`).join('')}function options(){return data.items.map(x=>`<option value="${esc(x.id)}">${esc(x.name)}</option>`).join('')}function addRow(){if(!data.items.length)return alert('No inventory item found. Add an item first.');const tbody=document.getElementById('rows');const tr=document.createElement('tr');tr.innerHTML=`<td class="srl"></td><td><select class="item"><option value="">Select item</option>${options()}</select></td><td><input class="unit" readonly placeholder="Unit"></td><td><input class="qty" type="number" min="1" step="1" placeholder="Qty"></td><td><button class="btn danger" type="button">×</button></td>`;tbody.appendChild(tr);tr.querySelector('.item').onchange=()=>{const x=data.items.find(i=>String(i.id)===tr.querySelector('.item').value);tr.querySelector('.unit').value=x?.unit||'Pcs'};tr.querySelector('.btn.danger').onclick=()=>{tr.remove();renumber()};renumber();tr.querySelector('.item').focus()}function renumber(){document.querySelectorAll('#rows tr').forEach((tr,i)=>tr.querySelector('.srl').textContent=i+1);document.getElementById('empty').style.display=document.querySelectorAll('#rows tr').length?'none':'block'}function saveIssue(){const customer=document.getElementById('customer').value;const rows=[...document.querySelectorAll('#rows tr')];if(!customer)return alert('Please select Party.');if(!rows.length)return alert('Please add at least one item.');const items=[];for(const tr of rows){const item=data.items.find(x=>String(x.id)===tr.querySelector('.item').value);const q=Number(tr.querySelector('.qty').value);if(!item)return alert('Please select an item in every row.');if(!Number.isFinite(q)||q<1)return alert('Please enter a valid Qty.');items.push({itemId:item.id,name:item.name,unit:item.unit||'Pcs',qty:q})}data.issues.push({id:uid(),invoice:document.getElementById('invoiceNo').value,date:document.getElementById('date').value,customerId:customer,items});localStorage.setItem(KEY,JSON.stringify(data));alert('Issue saved successfully.');location.reload()}function openParty(){document.getElementById('partyModal').classList.add('open');setTimeout(()=>document.getElementById('pname').focus(),50)}function closeParty(){document.getElementById('partyModal').classList.remove('open')}function saveParty(){const name=document.getElementById('pname').value.trim();if(!name)return alert('Party name is required.');const x={id:uid(),name,mobile:document.getElementById('pmobile').value.trim(),email:document.getElementById('pemail').value.trim(),address:document.getElementById('paddress').value.trim()};data.customers.push(x);localStorage.setItem(KEY,JSON.stringify(data));refreshParties();document.getElementById('customer').value=x.id;closeParty();['pname','pmobile','pemail','paddress'].forEach(i=>document.getElementById(i).value='')}function exitRentFlow(){if(confirm('Exit the current company and return to Company Selection?')){sessionStorage.removeItem('rentflow_company');location.href='index.html?company=select'}}function enableEnterNavigation(){document.addEventListener('keydown',e=>{if(e.key!=='Enter'||e.ctrlKey||e.metaKey)return;const t=e.target;if(!['INPUT','SELECT','TEXTAREA'].includes(t.tagName))return;e.preventDefault();const fields=[...document.querySelectorAll('input:not([readonly]),select,textarea,button.primary')].filter(x=>x.offsetParent!==null&&!x.disabled);const i=fields.indexOf(t);if(i>=0&&i<fields.length-1)fields[i+1].focus()})}refreshParties();enableEnterNavigation();</script></body></html>
