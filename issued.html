<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="favicon.svg" type="image/svg+xml"><meta name="theme-color" content="#008f78"><title>Issued / New Invoice • RentFlow</title>
<style>
:root{--e:#008f78;--ed:#006b59;--es:#e8f7f3;--bg:#f4f8f7;--ink:#17221f;--muted:#71807c;--line:#d9e5e2;--card:#fff;--danger:#c62828}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px Arial,system-ui,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.top{height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 24px;position:fixed;top:0;left:0;right:0;z-index:5}.brand{font-size:20px;font-weight:900}.layout{padding-top:64px;min-height:100vh}.side{position:fixed;top:64px;bottom:0;width:260px;background:#fff;border-right:1px solid var(--line);padding:14px;overflow:auto}.nav button{display:block;width:100%;border:0;background:transparent;text-align:left;padding:13px;border-radius:10px;font-weight:800;margin:4px 0}.nav button:hover,.nav button.active{background:var(--es);color:var(--ed)}.content{margin-left:260px;padding:24px;min-height:calc(100vh - 64px)}.page-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.page-title h1{margin:0;font-size:28px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px}.form{display:grid;grid-template-columns:1fr 1fr;gap:14px}.full{grid-column:1/-1}.field label{display:block;font-size:12px;font-weight:900;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:9px;background:#fff}.section{font-size:17px;font-weight:900;border-bottom:1px solid var(--line);padding-bottom:10px;margin:8px 0 14px}.issue-row{display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;gap:10px;align-items:end;background:#f7faf9;border:1px solid var(--line);border-radius:10px;padding:13px;margin-bottom:10px}.btn{border:0;border-radius:9px;padding:10px 14px;font-weight:800}.primary{background:var(--e);color:#fff}.secondary{background:var(--es);color:var(--ed)}.ghost{background:#fff;border:1px solid var(--line)}.danger{background:#fff0f0;color:var(--danger)}.total{font-size:24px;font-weight:900;margin-left:auto}.line{display:flex;align-items:center;gap:10px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{padding:12px 10px;border-bottom:1px solid var(--line);text-align:left}th{font-size:11px;color:var(--muted);text-transform:uppercase}.pill{background:var(--es);color:var(--ed);padding:5px 9px;border-radius:20px;font-weight:900}.empty{text-align:center;padding:40px;color:var(--muted)}@media(max-width:900px){.side{display:none}.content{margin-left:0;padding:18px 14px}.form{grid-template-columns:1fr}.full{grid-column:auto}.issue-row{grid-template-columns:1fr 1fr}}@media(max-width:600px){.issue-row{grid-template-columns:1fr}.page-title h1{font-size:22px}.line{flex-wrap:wrap}}
</style></head>
<body>
<header class="top"><div class="brand">RentFlow <span style="color:var(--muted)">• PaliaAPK HUB</span></div></header>
<div class="layout"><aside class="side"><nav class="nav"><button onclick="location.href='index.html'">⌂ &nbsp; Dashboard</button><button onclick="location.href='inventory.html'">▦ &nbsp; Inventory / Items</button><button onclick="location.href='customers.html'">♙ &nbsp; Customers / Parties</button><button class="active">↗ &nbsp; Issued / New Invoice</button><button onclick="location.href='returns.html'">↩ &nbsp; Returns / Receive</button><button onclick="location.href='register.html'">▤ &nbsp; Inventory Register</button><button onclick="location.href='reports.html'">▧ &nbsp; Reports / Bills</button><button onclick="location.href='company.html'">⌂ &nbsp; Shop / Company</button><button onclick="location.href='settings.html'">⚙ &nbsp; Settings / About</button></nav><div style="color:var(--muted);font-size:12px;margin:20px 8px">By PaliaAPK HUB<br>Developer by shanpalia</div></aside><main class="content"><div class="page-title"><h1>Issued / New Invoice</h1><button class="btn ghost" onclick="location.href='index.html'">← Dashboard</button></div><div class="card"><div class="form"><div class="field"><label>Customer / Party *</label><select id="customer"><option value="">Select party</option></select></div><div class="field"><label>Issue Date</label><input id="date" type="date"></div><div class="field full"><label>Invoice Note</label><input id="note" placeholder="Optional note"></div></div></div><div class="card"><div class="section">Inventory — select item, rent quantity and rent days</div><div id="rows"></div><button class="btn secondary" onclick="addRow()">＋ Add Inventory Item</button><div class="line" style="margin-top:20px"><span class="total" id="total">Total ₹0.00</span><button class="btn primary" onclick="saveIssue()">Save Invoice / Issue</button></div></div><div class="card"><div class="section">Current Inventory</div><div class="tablewrap"><table><thead><tr><th>Item</th><th>Code</th><th>Current Qty</th><th>Rent / Day</th></tr></thead><tbody id="inventory"></tbody></table></div></div></main></div>
<script>
const KEY='rentflow_web_v6';const load=()=>{try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return{}}};let data=load();data.items=Array.isArray(data.items)?data.items:[];data.customers=Array.isArray(data.customers)?data.customers:[];data.issues=Array.isArray(data.issues)?data.issues:[];data.shop=data.shop||{};data.settings=data.settings||{currency:'₹'};const cur=data.settings.currency||'₹';const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=v=>cur+Number(v||0).toFixed(2);const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);document.getElementById('date').value=new Date().toISOString().slice(0,10);document.getElementById('customer').innerHTML+data.customers.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('');document.getElementById('inventory').innerHTML=data.items.length?data.items.map(x=>`<tr><td><b>${esc(x.name)}</b></td><td>${esc(x.code)}</td><td><span class="pill">${Number(x.qty||0)}</span></td><td>${money(x.rent)}</td></tr>`).join(''):'<tr><td colspan="4" class="empty">No inventory items. Add items first.</td></tr>';
function addRow(){const box=document.getElementById('rows');const r=document.createElement('div');r.className='issue-row';r.innerHTML=`<div class="field"><label>Inventory Item</label><select class="item"><option value="">Select item</option>${data.items.map(x=>`<option value="${x.id}">${esc(x.name)} — Stock ${x.qty}</option>`).join('')}</select></div><div class="field"><label>Rent Qty</label><input class="qty" type="number" min="1" value="1"></div><div class="field"><label>Rent Days</label><input class="days" type="number" min="1" value="1"></div><div class="field"><label>Rent / Day</label><input class="rent" type="number" value="0" readonly></div><button class="btn danger" onclick="this.parentElement.remove();calc()">×</button>`;box.appendChild(r);r.querySelector('.item').onchange=()=>{const x=data.items.find(a=>a.id===r.querySelector('.item').value);r.querySelector('.rent').value=x?x.rent:0;calc()};r.querySelector('.qty').oninput=calc;r.querySelector('.days').oninput=calc;calc()}
function calc(){let t=0;document.querySelectorAll('.issue-row').forEach(r=>t+=(Number(r.querySelector('.rent').value)||0)*(Number(r.querySelector('.qty').value)||0)*(Number(r.querySelector('.days').value)||0));document.getElementById('total').textContent='Total '+money(t)}
function saveIssue(){const customer=document.getElementById('customer').value;const rows=[...document.querySelectorAll('.issue-row')];if(!customer)return alert('Please select Customer / Party.');if(!rows.length)return alert('Please add an inventory item.');const items=[];for(const r of rows){const item=data.items.find(x=>x.id===r.querySelector('.item').value),q=Number(r.querySelector('.qty').value),days=Number(r.querySelector('.days').value);if(!item||q<1||days<1||q>Number(item.qty||0))return alert('Please check item and Rent Qty.');items.push({itemId:item.id,name:item.name,qty:q,rent:Number(item.rent)||0,days,amount:(Number(item.rent)||0)*q*days});item.qty-=q}const amount=items.reduce((n,x)=>n+x.amount,0);data.issues.push({id:uid(),invoice:(data.shop.invoicePrefix||'INV')+'-'+String(data.issues.length+1).padStart(4,'0'),customerId:customer,date:document.getElementById('date').value,note:document.getElementById('note').value,items,amount});localStorage.setItem(KEY,JSON.stringify(data));alert('Invoice saved successfully.');location.reload()}
addRow();
</script></body></html>
