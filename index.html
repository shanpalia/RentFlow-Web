<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#008f78">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<title>RentFlow by PaliaAPK HUB</title>
<style>
:root{--e:#008f78;--ed:#006b5a;--es:#e7f6f1;--bg:#f5f8f7;--ink:#172521;--muted:#66756f;--line:#d8e5e1;--danger:#c62828;--white:#fff;--shadow:0 8px 24px rgba(0,52,43,.08)}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}.top{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 18px;position:sticky;top:0;z-index:20}.menu{border:0;background:transparent;font-size:28px}.brand{font-weight:900;font-size:18px}.layout{display:flex;min-height:calc(100vh - 68px)}.drawer{width:265px;background:#fff;border-right:1px solid var(--line);padding:16px;position:sticky;top:68px;height:calc(100vh - 68px)}.nav{display:grid;gap:6px}.nav button,.mobile button{border:0;background:transparent;text-align:left;padding:12px;border-radius:12px;font-weight:750;color:var(--ink)}.nav button.active,.nav button:hover,.mobile button.active{background:var(--es);color:var(--ed)}.main{flex:1;padding:22px;min-width:0}.page{display:none}.page.active{display:block}.card,.action,.stat{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.card{padding:18px;margin-bottom:16px}.head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}.head h2{margin:0;font-size:21px}.primary{border:0;background:var(--e);color:#fff;padding:10px 14px;border-radius:11px;font-weight:800}.danger{background:var(--danger)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.stat{padding:18px}.num{font-size:28px;font-weight:900}.muted{color:var(--muted)}.shop{display:flex;gap:15px;align-items:center}.shoplogo{width:68px;height:68px;border-radius:17px;background:var(--es);display:grid;place-items:center;font-size:28px}.action{padding:22px;cursor:pointer;transition:.15s}.action:hover{transform:translateY(-2px)}.icon{font-size:25px;margin-bottom:12px}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field label{display:block;font-size:13px;font-weight:800;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:#fff}.field textarea{min-height:85px}.full{grid-column:1/-1}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:11px 8px;border-bottom:1px solid var(--line);vertical-align:top}th{font-size:12px;color:var(--muted)}.tablewrap{overflow:auto}.empty{text-align:center;padding:35px;color:var(--muted)}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:var(--es);color:var(--ed);font-size:12px;font-weight:800}.modal{position:fixed;inset:0;background:#0006;display:none;place-items:center;padding:18px;z-index:50}.modal.open{display:grid}.modalbox{background:#fff;border-radius:18px;width:min(760px,100%);max-height:90vh;overflow:auto;padding:20px}.mobile{display:none}.small{font-size:12px}.right{text-align:right}.notice{background:var(--es);padding:12px;border-radius:12px;margin-bottom:12px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.x{border:0;background:#fee;color:var(--danger);border-radius:8px;padding:8px}.invoice-row{display:grid;grid-template-columns:1fr 90px 38px;gap:8px;margin-bottom:8px}.invoice-row input,.invoice-row select{padding:9px;border:1px solid var(--line);border-radius:9px}@media(max-width:900px){.drawer{display:none}.mobile{display:grid;position:fixed;bottom:10px;left:10px;right:10px;grid-template-columns:repeat(5,1fr);background:#fff;border:1px solid var(--line);border-radius:18px;padding:6px;z-index:30;box-shadow:var(--shadow)}.mobile button{text-align:center;font-size:11px}.main{padding:15px 15px 90px}.grid{grid-template-columns:repeat(2,1fr)}.formgrid{grid-template-columns:1fr}}@media(max-width:560px){.grid,.stats{grid-template-columns:1fr}.brand{font-size:15px}}
</style>
</head>
<body>
<header class="top"><button class="menu" onclick="toggleDrawer()">☰</button><div class="brand">RentFlow by PaliaAPK HUB</div></header>
<div class="layout"><aside class="drawer" id="drawer"><nav class="nav" id="nav"></nav><p class="muted small">By PaliaAPK HUB • Developer by shanpalia</p></aside><main class="main" id="main"></main></div><nav class="mobile" id="mobile"></nav>
<div class="modal" id="modal"><div class="modalbox" id="modalbox"></div></div>
<script>
const KEY='rentflow_v2';
const pages=['dashboard','inventory','customers','issued','returns','register','reports','shop','settings'];
const labels={dashboard:'Dashboard',inventory:'Inventory',customers:'Customers / Parties',issued:'Issued / New Invoice',returns:'Returns',register:'Inventory Register',reports:'Reports / Bills',shop:'Shop / Company',settings:'Settings / About'};
let db=load();
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x)return x}catch(e){}return{shop:{name:'Your Shop',owner:'',mobile:'',address:''},items:[],customers:[],issues:[],returns:[],settings:{currency:'₹'}}}
function persist(){localStorage.setItem(KEY,JSON.stringify(db));render()}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function money(v){return`${db.settings.currency||'₹'}${Number(v||0).toFixed(2)}`}
function today(){return new Date().toISOString().slice(0,10)}
function customerName(id){return db.customers.find(x=>x.id===id)?.name||'Unknown'}
function itemName(id){return db.items.find(x=>x.id===id)?.name||'Unknown item'}
function renderNav(){const html=pages.map(id=>`<button data-go="${id}">${labels[id]}</button>`).join('');document.getElementById('nav').innerHTML=html;document.getElementById('mobile').innerHTML=pages.slice(0,5).map(id=>`<button data-go="${id}">${labels[id].split(' ')[0]}</button>`).join('');document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go))}
function go(id){if(!pages.includes(id))id='dashboard';document.querySelectorAll('[data-go]').forEach(b=>b.classList.toggle('active',b.dataset.go===id));renderPage(id);if(innerWidth<901)document.getElementById('drawer').style.display='none';scrollTo(0,0)}
function toggleDrawer(){if(innerWidth>=901)return;const d=document.getElementById('drawer');d.style.display=d.style.display==='block'?'none':'block';d.style.position='fixed';d.style.top='68px';d.style.bottom='0';d.style.zIndex='25';d.style.overflow='auto';d.style.boxShadow='10px 0 30px #0002'}
function render(){renderNav();const active=document.querySelector('[data-go].active')?.dataset.go||'dashboard';go(active)}
function renderPage(id){const main=document.getElementById('main');main.innerHTML=pageHTML(id);document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>action(b.dataset.action))}
function pageHTML(id){if(id==='dashboard')return dashboardHTML();if(id==='inventory')return inventoryHTML();if(id==='customers')return customersHTML();if(id==='issued')return issuedHTML();if(id==='returns')return returnsHTML();if(id==='register')return registerHTML();if(id==='reports')return reportsHTML();if(id==='shop')return shopHTML();return settingsHTML()}
function dashboardHTML(){return`<div class="card shop"><div class="shoplogo">🏪</div><div style="flex:1"><h2 style="margin:0">${esc(db.shop.name||'Your Shop')}</h2><div class="muted">${esc(db.shop.owner||'Owner')} • ${esc(db.shop.mobile||'Mobile')}</div><div class="muted small">${esc(db.shop.address||'Add your shop address in Shop / Company')}</div></div><button class="primary" data-action="shop">Edit Shop</button></div><h1>Quick Actions</h1><p class="muted">Real local data • stored in this browser</p><div class="grid"><div class="action" data-action="invoice"><div class="icon">🧾</div><b>New Invoice</b><div class="muted">Issue items to party</div></div><div class="action" data-action="return"><div class="icon">↩</div><b>Return</b><div class="muted">Receive issued items</div></div><div class="action" data-action="item"><div class="icon">＋</div><b>Add Item</b><div class="muted">Inventory master</div></div><div class="action" data-action="customer"><div class="icon">👤</div><b>Add Customer</b><div class="muted">Party master</div></div><div class="action" data-action="inventory"><div class="icon">▦</div><b>Inventory</b><div class="muted">Current stock</div></div><div class="action" data-action="reports"><div class="icon">📄</div><b>Reports / Bills</b><div class="muted">Preview and print</div></div></div><div class="stats" style="margin-top:18px"><div class="stat"><div class="muted">Items</div><div class="num">${db.items.length}</div></div><div class="stat"><div class="muted">Parties</div><div class="num">${db.customers.length}</div></div><div class="stat"><div class="muted">Issued</div><div class="num">${db.issues.length}</div></div></div>`}
function inventoryHTML(){return`<div class="card"><div class="head"><h2>Inventory / Items</h2><button class="primary" data-action="item">＋ Add Item</button></div><div class="tablewrap"><table><thead><tr><th>Code</th><th>Item</th><th>Qty</th><th>Rent / 100</th><th>Action</th></tr></thead><tbody>${db.items.length?db.items.map(i=>`<tr><td>${esc(i.code)}</td><td><b>${esc(i.name)}</b></td><td>${i.qty}</td><td>${money(i.rent)}</td><td><button data-action="edit-item-${i.id}">Edit</button> <button class="x" data-action="delete-item-${i.id}">Delete</button></td></tr>`).join(''):`<tr><td colspan="5" class="empty">No inventory items yet. Tap Add Item.</td></tr>`}</tbody></table></div></div>`}
function customersHTML(){return`<div class="card"><div class="head"><h2>Customers / Parties</h2><button class="primary" data-action="customer">＋ Add Customer</button></div><div class="tablewrap"><table><thead><tr><th>Name</th><th>Mobile</th><th>Address</th><th>Action</th></tr></thead><tbody>${db.customers.length?db.customers.map(c=>`<tr><td><b>${esc(c.name)}</b></td><td>${esc(c.mobile)}</td><td>${esc(c.address)}</td><td><button data-action="edit-customer-${c.id}">Edit</button> <button class="x" data-action="delete-customer-${c.id}">Delete</button></td></tr>`).join(''):`<tr><td colspan="4" class="empty">No parties yet. Tap Add Customer.</td></tr>`}</tbody></table></div></div>`}
function issuedHTML(){return`<div class="card"><div class="head"><h2>Issued / New Invoice</h2><button class="primary" data-action="invoice">＋ New Invoice</button></div>${db.issues.length?`<div class="tablewrap"><table><thead><tr><th>Invoice</th><th>Customer</th><th>Date</th><th>Qty</th><th>Action</th></tr></thead><tbody>${db.issues.map(x=>`<tr><td><b>${esc(x.invoice)}</b></td><td>${esc(customerName(x.customerId))}</td><td>${x.date}</td><td>${x.items.reduce((a,b)=>a+b.qty,0)}</td><td><button data-action="print-${x.id}">Print</button></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">No invoices yet. Add customer and item first, then create an invoice.</div>`}</div>`}
function returnsHTML(){return`<div class="card"><div class="head"><h2>Returns / Receive</h2></div>${db.issues.length?db.issues.map(x=>`<div class="card" style="box-shadow:none;background:#f9fbfa"><b>${esc(x.invoice)}</b> • ${esc(customerName(x.customerId))} • ${x.date}<div class="row" style="margin-top:8px">${x.items.map(i=>`<span class="pill">${esc(itemName(i.itemId))}: ${remaining(x.id,i.itemId)} left</span>`).join('')}</div><br><button class="primary" data-action="return-${x.id}">Receive Return</button></div>`).join(''):`<div class="empty">No issued invoices.</div>`}</div>`}
function remaining(issueId,itemId){const issue=db.issues.find(x=>x.id===issueId);const original=issue?.items.find(x=>x.itemId===itemId)?.qty||0;const returned=db.returns.filter(x=>x.issueId===issueId).flatMap(x=>x.items).filter(x=>x.itemId===itemId).reduce((a,x)=>a+x.qty,0);return Math.max(0,original-returned)}
function registerHTML(){return`<div class="card"><div class="head"><h2>Inventory Register</h2></div><div class="tablewrap"><table><thead><tr><th>Item</th><th>Code</th><th>Current Stock</th><th>Issued</th><th>Returned</th></tr></thead><tbody>${db.items.map(i=>{const issued=db.issues.flatMap(x=>x.items).filter(x=>x.itemId===i.id).reduce((a,x)=>a+x.qty,0);const returned=db.returns.flatMap(x=>x.items).filter(x=>x.itemId===i.id).reduce((a,x)=>a+x.qty,0);return`<tr><td>${esc(i.name)}</td><td>${esc(i.code)}</td><td><b>${i.qty}</b></td><td>${issued}</td><td>${returned}</td></tr>`}).join('')||`<tr><td colspan="5" class="empty">No inventory records.</td></tr>`}</tbody></table></div></div>`}
function reportsHTML(){return`<div class="card"><div class="head"><h2>Reports / Bills</h2><button class="primary" data-action="print-report">Print Report</button></div><div class="stats"><div class="stat"><div class="muted">Invoices</div><div class="num">${db.issues.length}</div></div><div class="stat"><div class="muted">Returns</div><div class="num">${db.returns.length}</div></div><div class="stat"><div class="muted">Return Amount</div><div class="num">${money(db.returns.reduce((a,x)=>a+x.amount,0))}</div></div></div></div>`}
function shopHTML(){return`<div class="card"><div class="head"><h2>Shop / Company</h2></div><form id="shopForm"><div class="formgrid"><div class="field"><label>Shop Name *</label><input name="name" required value="${esc(db.shop.name)}"></div><div class="field"><label>Owner</label><input name="owner" value="${esc(db.shop.owner)}"></div><div class="field"><label>Mobile</label><input name="mobile" value="${esc(db.shop.mobile)}"></div><div class="field full"><label>Address</label><textarea name="address">${esc(db.shop.address)}</textarea></div></div><br><button class="primary">Save Shop Details</button></form></div>`}
function settingsHTML(){return`<div class="card"><div class="head"><h2>Settings / About</h2></div><div class="field"><label>Currency Symbol</label><input id="currency" value="${esc(db.settings.currency)}"></div><br><button class="primary" data-action="settings-save">Save Settings</button><hr><p><b>RentFlow</b> • PaliaAPK HUB</p><p class="muted">Developer by shanpalia</p><button class="primary danger" data-action="reset">Reset Local Data</button></div>`}
function modal(html){document.getElementById('modalbox').innerHTML=html;document.getElementById('modal').classList.add('open')}
function closeModal(){document.getElementById('modal').classList.remove('open')}
document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')closeModal()}
function itemForm(id=''){const i=db.items.find(x=>x.id===id)||{name:'',code:'',qty:0,rent:15};modal(`<div class="head"><h2>${id?'Edit':'Add'} Item</h2><button onclick="closeModal()">✕</button></div><form id="itemForm"><div class="formgrid"><div class="field"><label>Item Name *</label><input name="name" required value="${esc(i.name)}"></div><div class="field"><label>Item Code</label><input name="code" value="${esc(i.code)}"></div><div class="field"><label>Quantity *</label><input name="qty" type="number" min="0" required value="${i.qty}"></div><div class="field"><label>Rent / 100 *</label><input name="rent" type="number" min="0" step="0.01" required value="${i.rent}"></div></div><br><button class="primary">Save Item</button></form>`);document.getElementById('itemForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);const x={id:id||uid(),name:f.get('name').trim(),code:f.get('code').trim(),qty:+f.get('qty'),rent:+f.get('rent')};const n=db.items.findIndex(a=>a.id===x.id);if(n>=0)db.items[n]=x;else db.items.push(x);closeModal();persist()}}
function customerForm(id=''){const c=db.customers.find(x=>x.id===id)||{name:'',mobile:'',address:''};modal(`<div class="head"><h2>${id?'Edit':'Add'} Customer</h2><button onclick="closeModal()">✕</button></div><form id="customerForm"><div class="formgrid"><div class="field"><label>Name *</label><input name="name" required value="${esc(c.name)}"></div><div class="field"><label>Mobile</label><input name="mobile" value="${esc(c.mobile)}"></div><div class="field full"><label>Address</label><textarea name="address">${esc(c.address)}</textarea></div></div><br><button class="primary">Save Customer</button></form>`);document.getElementById('customerForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);const x={id:id||uid(),name:f.get('name').trim(),mobile:f.get('mobile').trim(),address:f.get('address').trim()};const n=db.customers.findIndex(a=>a.id===x.id);if(n>=0)db.customers[n]=x;else db.customers.push(x);closeModal();persist()}}
function invoiceForm(){let rows=[{itemId:db.items[0]?.id||'',qty:1}];function html(){return`<div class="head"><h2>New Invoice</h2><button onclick="closeModal()">✕</button></div><form id="invoiceForm"><div class="formgrid"><div class="field"><label>Customer *</label><select name="customer" required>${db.customers.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div><div class="field"><label>Invoice Number *</label><input name="invoice" required value="INV-${Date.now()}"></div><div class="field"><label>Issue Date *</label><input name="date" type="date" required value="${today()}"></div></div><h3>Items</h3><div id="invoiceRows">${rows.map((r,n)=>row(n,r)).join('')}</div><button type="button" onclick="rows.push({itemId:db.items[0].id,qty:1});document.getElementById('invoiceRows').innerHTML=rows.map((r,n)=>row(n,r)).join('')">＋ Add Item</button><br><br><button class="primary">Save Invoice</button></form>`}function row(n,r){return`<div class="invoice-row"><select onchange="rows[${n}].itemId=this.value">${db.items.map(i=>`<option value="${i.id}" ${i.id===r.itemId?'selected':''}>${esc(i.name)} (stock ${i.qty})</option>`).join('')}</select><input type="number" min="1" value="${r.qty}" onchange="rows[${n}].qty=+this.value"><button type="button" class="x" onclick="rows.splice(${n},1);document.getElementById('invoiceRows').innerHTML=rows.map((r,n)=>row(n,r)).join('')">✕</button></div>`}modal(html());document.getElementById('invoiceForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);const used={};for(const r of rows){if(!r.itemId||r.qty<1)return alert('Enter valid item quantity');used[r.itemId]=(used[r.itemId]||0)+r.qty}for(const id in used){const it=db.items.find(x=>x.id===id);if(!it||used[id]>it.qty)return alert('Insufficient stock for '+itemName(id))}for(const id in used)db.items.find(x=>x.id===id).qty-=used[id];db.issues.push({id:uid(),invoice:f.get('invoice').trim(),customerId:f.get('customer'),date:f.get('date'),items:rows.map(r=>({itemId:r.itemId,qty:r.qty,rent:db.items.find(x=>x.id===r.itemId).rent}))});closeModal();persist();go('issued')}}
function returnForm(issueId){const issue=db.issues.find(x=>x.id===issueId);modal(`<div class="head"><h2>Return ${esc(issue.invoice)}</h2><button onclick="closeModal()">✕</button></div><form id="returnForm"><div class="notice">Customer: ${esc(customerName(issue.customerId))} • Issue Date: ${issue.date} • Return Date: ${today()}</div>${issue.items.map((i,n)=>`<div class="field"><label>${esc(itemName(i.itemId))} — available ${remaining(issueId,i.itemId)}</label><input name="q${n}" type="number" min="0" max="${remaining(issueId,i.itemId)}" value="${remaining(issueId,i.itemId)}"></div><br>`).join('')}<div class="field"><label>Return Amount (optional)</label><input name="amount" type="number" step="0.01"></div><br><button class="primary">Save Return</button></form>`);document.getElementById('returnForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),out=[];issue.items.forEach((i,n)=>{const q=+f.get('q'+n)||0;if(q)out.push({itemId:i.itemId,qty:q,rent:i.rent})});if(!out.length)return alert('Select return quantity');out.forEach(i=>{const it=db.items.find(x=>x.id===i.itemId);if(it)it.qty+=i.qty});const amount=+f.get('amount')||0;db.returns.push({id:uid(),issueId,customerId:issue.customerId,date:today(),amount,items:out});closeModal();persist();go('returns')}}
function action(a){if(a==='shop'){go('shop');return}if(a==='inventory'){go('inventory');return}if(a==='reports'){go('reports');return}if(a==='item'){itemForm();return}if(a==='customer'){customerForm();return}if(a==='invoice'){if(!db.customers.length||!db.items.length)return modal(`<div class="head"><h2>Setup required</h2><button onclick="closeModal()">✕</button></div><div class="notice">Please add at least one Customer and one Inventory Item before creating an invoice.</div>`);invoiceForm();return}if(a==='return'){go('returns');return}if(a==='settings-save'){db.settings.currency=document.getElementById('currency').value.trim()||'₹';persist();alert('Settings saved');return}if(a==='reset'){if(confirm('Delete all local RentFlow data?')){localStorage.removeItem(KEY);location.reload()}return}if(a.startsWith('edit-item-')){itemForm(a.slice(10));return}if(a.startsWith('delete-item-')){const id=a.slice(12);if(confirm('Delete this item?')){db.items=db.items.filter(x=>x.id!==id);persist()}return}if(a.startsWith('edit-customer-')){customerForm(a.slice(15));return}if(a.startsWith('delete-customer-')){const id=a.slice(18);if(confirm('Delete this customer?')){db.customers=db.customers.filter(x=>x.id!==id);persist()}return}if(a.startsWith('return-')){returnForm(a.slice(7));return}if(a.startsWith('print-')){printIssue(a.slice(6));return}if(a==='print-report'){printReport();return}}
document.addEventListener('submit',e=>{if(e.target.id==='shopForm'){e.preventDefault();const f=new FormData(e.target);db.shop={name:f.get('name').trim(),owner:f.get('owner').trim(),mobile:f.get('mobile').trim(),address:f.get('address').trim()};persist();alert('Shop details saved')}});
function printIssue(id){const x=db.issues.find(i=>i.id===id);if(!x)return;printWindow(`<h1>${esc(db.shop.name)}</h1><p>${esc(db.shop.address)}<br>${esc(db.shop.mobile)}</p><h2>Issue Invoice: ${esc(x.invoice)}</h2><p>Customer: ${esc(customerName(x.customerId))}<br>Date: ${x.date}</p><table><tr><th>Item</th><th>Qty</th><th>Rent / 100</th></tr>${x.items.map(i=>`<tr><td>${esc(itemName(i.itemId))}</td><td>${i.qty}</td><td>${money(i.rent)}</td></tr>`).join('')}</table>`)}
function printReport(){printWindow(`<h1>${esc(db.shop.name)} — RentFlow Report</h1><p>Generated: ${today()}</p><p>Total invoices: ${db.issues.length}<br>Total returns: ${db.returns.length}<br>Total return amount: ${money(db.returns.reduce((a,x)=>a+x.amount,0))}</p>`)}
function printWindow(body){const w=window.open('','_blank');if(!w)return alert('Please allow pop-ups for printing');w.document.write(`<html><head><title>RentFlow</title><style>body{font-family:Arial;padding:30px}table{width:100%;border-collapse:collapse}td,th{border:1px solid #ccc;padding:8px;text-align:left}</style></head><body>${body}</body></html>`);w.document.close();w.focus();setTimeout(()=>w.print(),300)}
render();
</script>
</body>
</html>
