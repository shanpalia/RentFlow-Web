<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#008f78">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<title>RentFlow • PaliaAPK HUB</title>
<style>
:root{--e:#008f78;--d:#006b59;--s:#e5f6f1;--bg:#f4f8f7;--ink:#15221f;--muted:#687873;--line:#d9e6e2;--red:#c62828;--card:#fff;--shadow:0 8px 28px rgba(0,70,55,.08)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.top{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 18px;gap:14px;position:sticky;top:0;z-index:40}.hamb{border:0;background:transparent;font-size:27px}.brand{font-weight:900;font-size:19px}.layout{display:flex;min-height:calc(100vh - 68px)}.side{width:270px;background:#fff;border-right:1px solid var(--line);padding:16px;position:sticky;top:68px;height:calc(100vh - 68px);z-index:30}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;text-align:left;padding:12px 13px;border-radius:12px;font-weight:750;color:var(--ink)}.nav button:hover,.nav button.active{background:var(--s);color:var(--d)}.content{flex:1;min-width:0;padding:22px}.page-title{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.page-title h1{margin:0;font-size:26px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow);margin-bottom:16px}.hero{display:flex;align-items:center;gap:16px}.logo{width:68px;height:68px;border-radius:18px;background:var(--s);display:grid;place-items:center;font-size:31px}.hero h2{margin:0 0 5px}.muted{color:var(--muted)}.small{font-size:12px}.btn{border:0;border-radius:11px;padding:10px 14px;font-weight:800}.primary{background:var(--e);color:#fff}.secondary{background:var(--s);color:var(--d)}.danger{background:#fff0f0;color:var(--red)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.quick{padding:20px;background:#fff;border:1px solid var(--line);border-radius:17px;box-shadow:var(--shadow);cursor:pointer}.quick:hover{border-color:var(--e);transform:translateY(-1px)}.quick .ico{font-size:27px;margin-bottom:10px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.stat{background:#fff;border:1px solid var(--line);border-radius:17px;padding:18px}.stat .n{font-size:28px;font-weight:900;margin-top:5px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px 9px;border-bottom:1px solid var(--line);white-space:nowrap}th{font-size:12px;color:var(--muted)}.empty{padding:45px;text-align:center;color:var(--muted)}.form{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field label{display:block;font-size:13px;font-weight:800;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--e);box-shadow:0 0 0 3px var(--s)}.full{grid-column:1/-1}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.pill{display:inline-block;background:var(--s);color:var(--d);padding:4px 8px;border-radius:999px;font-size:12px;font-weight:800}.modal{position:fixed;inset:0;background:#0007;display:none;place-items:center;padding:18px;z-index:100}.modal.open{display:grid}.modalbox{width:min(820px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:20px;padding:20px}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.modalhead h2{margin:0}.close{border:0;background:#f0f3f2;border-radius:9px;padding:7px 11px}.mobile-nav{display:none}.invoice-line{display:grid;grid-template-columns:1fr 100px 45px;gap:8px;margin-bottom:8px}.invoice-line select,.invoice-line input{width:100%;padding:10px;border:1px solid var(--line);border-radius:9px}@media(max-width:900px){.side{display:none}.content{padding:15px 15px 90px}.grid{grid-template-columns:1fr 1fr}.stats{grid-template-columns:1fr 1fr}.mobile-nav{display:grid;position:fixed;left:10px;right:10px;bottom:10px;grid-template-columns:repeat(5,1fr);gap:3px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:6px;z-index:50;box-shadow:var(--shadow)}.mobile-nav button{border:0;background:transparent;border-radius:10px;padding:9px 3px;font-size:11px}.mobile-nav button.active{background:var(--s);color:var(--d);font-weight:800}.form{grid-template-columns:1fr}.full{grid-column:auto}}@media(max-width:560px){.grid,.stats{grid-template-columns:1fr}.page-title{align-items:flex-start}.hero{align-items:flex-start}.hero .btn{margin-left:auto}.brand{font-size:16px}}
</style>
<style><!-- rentflow-company-fix -->.company-logo{object-fit:cover}</style></head>
<body>
<header class="top"><button class="hamb" id="menuBtn">☰</button><div class="brand">RentFlow <span class="muted">• PaliaAPK HUB</span></div></header>
<div class="layout"><aside class="side" id="side"><nav class="nav" id="nav"></nav><div class="small muted" style="margin:18px 8px">By PaliaAPK HUB<br>Developer by shanpalia</div></aside><main class="content" id="app"></main></div>
<nav class="mobile-nav" id="mobileNav"></nav>
<div class="modal" id="modal"><div class="modalbox" id="modalBox"></div></div>
<script>
'use strict';
const KEY='rentflow_web_v3';
const PAGES=[['dashboard','⌂','Dashboard'],['inventory','▦','Inventory'],['customers','♙','Customers / Parties'],['issued','↗','Issued / New Invoice'],['returns','↩','Returns'],['register','▤','Inventory Register'],['reports','▧','Reports / Bills'],['shop','⌂','Shop / Company'],['settings','⚙','Settings / About']];
let data=read();let current='dashboard';
function blank(){return{shop:{name:'Your Shop',owner:'',mobile:'',address:'',image:''},items:[],customers:[],issues:[],returns:[],settings:{currency:'₹'}}}
function read(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x){const b=blank();return {...b,...x,shop:{...b.shop,...(x.shop||{})},settings:{...b.settings,...(x.settings||{})}}}}catch(e){}return blank()}
function save(){localStorage.setItem(KEY,JSON.stringify(data));render(current)}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function money(v){return (data.settings.currency||'₹')+Number(v||0).toFixed(2)}
function today(){return new Date().toISOString().slice(0,10)}
function cname(id){return data.customers.find(x=>x.id===id)?.name||'Unknown party'}
function iname(id){return data.items.find(x=>x.id===id)?.name||'Unknown item'}
function stock(id){return Number(data.items.find(x=>x.id===id)?.qty||0)}
function nav(){const html=PAGES.map(p=>`<button data-page="${p[0]}"><span style="display:inline-block;width:28px">${p[1]}</span>${p[2]}</button>`).join('');document.getElementById('nav').innerHTML=html;document.getElementById('mobileNav').innerHTML=PAGES.slice(0,5).map(p=>`<button data-page="${p[0]}">${p[1]}<br>${p[2].split(' ')[0]}</button>`).join('');document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.page)))}
function go(p){current=PAGES.some(x=>x[0]===p)?p:'dashboard';document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===current));render(current);if(innerWidth<901)document.getElementById('side').style.display='none';scrollTo(0,0)}
function render(p){nav();document.getElementById('app').innerHTML=pages(p);bind()}
function bind(){document.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.go)));document.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',()=>act(b.dataset.action)))}
function pages(p){return({dashboard:dashboard,inventory:inventory,customers:customers,issued:issued,returns:returns,register:register,reports:reports,shop:shop,settings:settings}[p]||dashboard)()}
function title(t,button=''){return`<div class="page-title"><h1>${t}</h1>${button}</div>`}
function dashboard(){return title('Dashboard',`<button class="btn primary" data-go="invoice">+ New Invoice</button>`).replace('</div>',`</div><div class="card hero"><div class="logo">🏪</div><div style="flex:1"><h2>${esc(data.shop.name||'Your Shop')}</h2><div class="muted">${esc(data.shop.owner||'Shop Owner')} • ${esc(data.shop.mobile||'Mobile')}</div><div class="small muted">${esc(data.shop.address||'Add shop details')}</div></div><button class="btn secondary" data-go="shop">Shop Settings</button></div><div class="stats"><div class="stat"><div class="muted">Total Items</div><div class="n">${data.items.length}</div></div><div class="stat"><div class="muted">Parties</div><div class="n">${data.customers.length}</div></div><div class="stat"><div class="muted">Issued Invoices</div><div class="n">${data.issues.length}</div></div><div class="stat"><div class="muted">Returns</div><div class="n">${data.returns.length}</div></div></div><div class="card"><h2>Quick Actions</h2><div class="grid"><div class="quick" data-go="issued"><div class="ico">🧾</div><b>New Invoice</b><div class="muted small">Issue rental items</div></div><div class="quick" data-go="returns"><div class="ico">↩</div><b>Returns</b><div class="muted small">Receive issued items</div></div><div class="quick" data-action="add-item"><div class="ico">＋</div><b>Add Item</b><div class="muted small">Inventory master</div></div><div class="quick" data-action="add-customer"><div class="ico">👤</div><b>Add Customer</b><div class="muted small">Party master</div></div><div class="quick" data-go="inventory"><div class="ico">▦</div><b>Inventory</b><div class="muted small">Current stock</div></div><div class="quick" data-go="reports"><div class="ico">📄</div><b>Reports / Bills</b><div class="muted small">Print reports</div></div></div></div>`) }
function inventory(){return title('Inventory / Items',`<button class="btn primary" data-action="add-item">＋ Add Item</button>`)+`<div class="card"><div class="tablewrap"><table><thead><tr><th>Code</th><th>Item</th><th>Category</th><th>Qty</th><th>Rent / 100</th><th>Actions</th></tr></thead><tbody>${data.items.length?data.items.map(i=>`<tr><td>${esc(i.code)}</td><td><b>${esc(i.name)}</b></td><td><span class="pill">${esc(i.category||'General')}</span></td><td><b>${i.qty}</b></td><td>${money(i.rent)}</td><td><button class="btn secondary" data-action="edit-item:${i.id}">Edit</button> <button class="btn danger" data-action="delete-item:${i.id}">Delete</button></td></tr>`).join(''):`<tr><td colspan="6" class="empty">No inventory yet. Click Add Item to register your rental stock.</td></tr>`}</tbody></table></div></div>`}
function customers(){return title('Customers / Parties',`<button class="btn primary" data-action="add-customer">＋ Add Customer</button>`)+`<div class="card"><div class="tablewrap"><table><thead><tr><th>Name</th><th>Mobile</th><th>Address</th><th>Actions</th></tr></thead><tbody>${data.customers.length?data.customers.map(c=>`<tr><td><b>${esc(c.name)}</b></td><td>${esc(c.mobile)}</td><td>${esc(c.address)}</td><td><button class="btn secondary" data-action="edit-customer:${c.id}">Edit</button> <button class="btn danger" data-action="delete-customer:${c.id}">Delete</button></td></tr>`).join(''):`<tr><td colspan="4" class="empty">No parties yet.</td></tr>`}</tbody></table></div></div>`}
function issued(){return title('Issued / New Invoice',`<button class="btn primary" data-action="new-invoice">＋ New Invoice</button>`)+`<div class="card"><div class="tablewrap"><table><thead><tr><th>Invoice</th><th>Customer</th><th>Date</th><th>Items</th><th>Qty</th><th>Amount</th><th>Action</th></tr></thead><tbody>${data.issues.length?data.issues.map(x=>`<tr><td><b>${esc(x.invoice)}</b></td><td>${esc(cname(x.customerId))}</td><td>${esc(x.date)}</td><td>${x.items.length}</td><td>${x.items.reduce((n,i)=>n+Number(i.qty),0)}</td><td>${money(x.amount)}</td><td><button class="btn secondary" data-action="print-issue:${x.id}">Print</button></td></tr>`).join(''):`<tr><td colspan="7" class="empty">No issued invoices yet. Click New Invoice.</td></tr>`}</tbody></table></div></div>`}
function returns(){return title('Returns / Receive',`<button class="btn primary" data-action="new-return">＋ Receive Return</button>`)+`<div class="card"><div class="tablewrap"><table><thead><tr><th>Return</th><th>Invoice</th><th>Customer</th><th>Date</th><th>Qty</th><th>Amount</th></tr></thead><tbody>${data.returns.length?data.returns.map(x=>`<tr><td><b>${esc(x.number)}</b></td><td>${esc(x.invoice)}</td><td>${esc(cname(x.customerId))}</td><td>${x.date}</td><td>${x.items.reduce((n,i)=>n+Number(i.qty),0)}</td><td>${money(x.amount)}</td></tr>`).join(''):`<tr><td colspan="6" class="empty">No returns recorded.</td></tr>`}</tbody></table></div></div>`}
function register(){return title('Inventory Register')+`<div class="card"><div class="tablewrap"><table><thead><tr><th>Item</th><th>Code</th><th>Opening / Current</th><th>Total Issued</th><th>Total Returned</th></tr></thead><tbody>${data.items.length?data.items.map(i=>{let is=0,re=0;data.issues.forEach(x=>x.items.forEach(q=>{if(q.itemId===i.id)is+=Number(q.qty)}));data.returns.forEach(x=>x.items.forEach(q=>{if(q.itemId===i.id)re+=Number(q.qty)}));return`<tr><td><b>${esc(i.name)}</b></td><td>${esc(i.code)}</td><td>${i.qty}</td><td>${is}</td><td>${re}</td></tr>`}).join(''):`<tr><td colspan="5" class="empty">No inventory records.</td></tr>`}</tbody></table></div></div>`}
function reports(){const total=data.issues.reduce((n,x)=>n+Number(x.amount||0),0);return title('Reports / Bills',`<button class="btn primary" data-action="print-report">Print Report</button>`)+`<div class="stats"><div class="stat"><div class="muted">Invoices</div><div class="n">${data.issues.length}</div></div><div class="stat"><div class="muted">Returns</div><div class="n">${data.returns.length}</div></div><div class="stat"><div class="muted">Rental Billing</div><div class="n">${money(total)}</div></div><div class="stat"><div class="muted">Items</div><div class="n">${data.items.length}</div></div></div><div class="card"><h2>Recent Bills</h2>${data.issues.slice().reverse().slice(0,10).map(x=>`<div class="row" style="padding:10px 0;border-bottom:1px solid var(--line)"><b style="min-width:120px">${esc(x.invoice)}</b><span>${esc(cname(x.customerId))}</span><span class="muted">${x.date}</span><span style="margin-left:auto">${money(x.amount)}</span><button class="btn secondary" data-action="print-issue:${x.id}">Print</button></div>`).join('')||'<div class="empty">No bills available.</div>'}</div>`}
function shop(){return title('Shop / Company',`<button class="btn primary" data-action="save-shop">Save Company</button>`)+`<div class="card"><div class="hero" style="margin-bottom:18px"><div class="logo" style="overflow:hidden">${data.shop.image?`<img src="${data.shop.image}" style="width:100%;height:100%;object-fit:cover">`:'🏪'}</div><div><h2 style="margin:0 0 4px">Company Profile</h2><div class="muted small">Company details and logo are saved in this browser.</div></div></div><div class="form"><div class="field"><label>Shop / Company Name *</label><input id="shopName" value="${esc(data.shop.name)}"></div><div class="field"><label>Owner Name</label><input id="shopOwner" value="${esc(data.shop.owner)}"></div><div class="field"><label>Mobile</label><input id="shopMobile" value="${esc(data.shop.mobile)}"></div><div class="field"><label>Currency</label><input id="shopCurrency" value="${esc(data.settings.currency||'₹')}"></div><div class="field full"><label>Address</label><textarea id="shopAddress">${esc(data.shop.address)}</textarea></div><div class="field full"><label>Company Logo / Image</label><input id="shopImage" type="file" accept="image/png,image/jpeg,image/webp,image/svg+xml"><div class="small muted" style="margin-top:6px">PNG, JPG, WEBP or SVG. The selected image is stored locally in this browser.</div></div><div class="full toolbar"><button class="btn primary" data-action="save-shop">Save Company Details</button><button class="btn secondary" data-action="remove-shop-image">Remove Image</button></div></div></div>`}
function settings(){return title('Settings / About')+`<div class="card"><h2>RentFlow</h2><p class="muted">Rental inventory, parties, issue invoices, returns, register and printable reports.</p><div class="notice">All application data is stored locally in this browser. No demo records are inserted.</div><button class="btn danger" data-action="clear-data">Clear All Local Data</button><p class="small muted">RentFlow • By PaliaAPK HUB • Developer by shanpalia</p></div>`}
function openModal(html){document.getElementById('modalBox').innerHTML=html;document.getElementById('modal').classList.add('open');bind()}
function closeModal(){document.getElementById('modal').classList.remove('open')}
function act(a){if(a==='add-item')return itemForm();if(a.startsWith('edit-item:'))return itemForm(a.split(':')[1]);if(a.startsWith('delete-item:')){if(confirm('Delete this item?')){data.items=data.items.filter(x=>x.id!==a.split(':')[1]);save()}return}if(a==='add-customer')return customerForm();if(a.startsWith('edit-customer:'))return customerForm(a.split(':')[1]);if(a.startsWith('delete-customer:')){if(confirm('Delete this customer?')){data.customers=data.customers.filter(x=>x.id!==a.split(':')[1]);save()}return}if(a==='new-invoice')return invoiceForm();if(a==='new-return')return returnForm();if(a==='save-shop'){const f=document.getElementById('shopImage')?.files?.[0];const apply=(image)=>{data.shop={...data.shop,name:document.getElementById('shopName').value.trim()||'Your Shop',owner:document.getElementById('shopOwner').value.trim(),mobile:document.getElementById('shopMobile').value.trim(),address:document.getElementById('shopAddress').value.trim(),image:data.shop.image||''};if(image)data.shop.image=image;data.settings.currency=document.getElementById('shopCurrency').value.trim()||'₹';save()};if(f){if(f.size>2*1024*1024)return alert('Company image must be 2 MB or smaller.');const r=new FileReader();r.onload=()=>apply(String(r.result||''));r.readAsDataURL(f)}else apply('');return}if(a==='remove-shop-image'){data.shop.image='';save();return}if(a==='clear-data'){if(confirm('Clear all RentFlow data from this browser?')){localStorage.removeItem(KEY);data=blank();save()}return}if(a.startsWith('print-issue:'))return printIssue(a.split(':')[1]);if(a==='print-report')return printReport()}
function itemForm(id){const old=data.items.find(x=>x.id===id)||{name:'',code:'',category:'General',qty:0,rent:15};openModal(`<div class="modalhead"><h2>${id?'Edit':'Add'} Item</h2><button class="close" data-action="close">×</button></div><div class="form"><div class="field"><label>Item Name *</label><input id="fName" value="${esc(old.name)}"></div><div class="field"><label>Item Code</label><input id="fCode" value="${esc(old.code)}"></div><div class="field"><label>Category</label><input id="fCat" value="${esc(old.category)}"></div><div class="field"><label>Quantity *</label><input id="fQty" type="number" min="0" value="${old.qty}"></div><div class="field"><label>Rent per 100 days</label><input id="fRent" type="number" min="0" step="0.01" value="${old.rent}"></div><div class="full"><button class="btn primary" data-action="save-item:${id||''}">Save Item</button></div></div>`)}
function customerForm(id){const old=data.customers.find(x=>x.id===id)||{name:'',mobile:'',address:''};openModal(`<div class="modalhead"><h2>${id?'Edit':'Add'} Customer / Party</h2><button class="close" data-action="close">×</button></div><div class="form"><div class="field"><label>Name *</label><input id="cName" value="${esc(old.name)}"></div><div class="field"><label>Mobile</label><input id="cMobile" value="${esc(old.mobile)}"></div><div class="field full"><label>Address</label><textarea id="cAddress">${esc(old.address)}</textarea></div><div class="full"><button class="btn primary" data-action="save-customer:${id||''}">Save Customer</button></div></div>`)}
function invoiceForm(){if(!data.customers.length||!data.items.length)return alert('First add at least one customer and one inventory item.');openModal(`<div class="modalhead"><h2>New Rental Invoice</h2><button class="close" data-action="close">×</button></div><div class="form"><div class="field"><label>Customer / Party *</label><select id="iCustomer"><option value="">Select customer</option>${data.customers.map(c=>`<option value="${c.id}">${esc(c.name)} • ${esc(c.mobile)}</option>`).join('')}</select></div><div class="field"><label>Issue Date</label><input id="iDate" type="date" value="${today()}"></div><div class="full"><label style="font-weight:800;display:block;margin-bottom:7px">Items</label><div id="lines"></div><button class="btn secondary" data-action="add-line">＋ Add Item Line</button></div><div class="full right"><b>Total: <span id="iTotal">₹0.00</span></b></div><div class="full"><button class="btn primary" data-action="save-invoice">Save & Issue Invoice</button></div></div>`);addLine()}
function addLine(){const box=document.getElementById('lines');if(!box)return;const row=document.createElement('div');row.className='invoice-line';row.innerHTML=`<select class="line-item"><option value="">Select item</option>${data.items.map(i=>`<option value="${i.id}">${esc(i.name)} • Stock ${i.qty}</option>`).join('')}</select><input class="line-qty" type="number" min="1" value="1"><button class="btn danger remove-line">×</button>`;row.querySelector('.remove-line').onclick=()=>{row.remove();invoiceTotal()};row.querySelector('.line-item').onchange=invoiceTotal;row.querySelector('.line-qty').oninput=invoiceTotal;box.appendChild(row);invoiceTotal()}
function invoiceTotal(){let t=0;document.querySelectorAll('.invoice-line').forEach(r=>{const i=data.items.find(x=>x.id===r.querySelector('.line-item').value);t+=(Number(i?.rent||0)*Number(r.querySelector('.line-qty').value||0))/100});const el=document.getElementById('iTotal');if(el)el.textContent=money(t)}
function returnForm(){if(!data.issues.length)return alert('There is no issued invoice to return.');openModal(`<div class="modalhead"><h2>Receive Return</h2><button class="close" data-action="close">×</button></div><div class="form"><div class="field full"><label>Issued Invoice *</label><select id="rIssue"><option value="">Select invoice</option>${data.issues.map(x=>`<option value="${x.id}">${esc(x.invoice)} • ${esc(cname(x.customerId))} • ${x.date}</option>`).join('')}</select></div><div id="returnLines" class="full"><div class="empty">Select an invoice.</div></div><div class="full"><button class="btn primary" data-action="save-return">Save Return & Receipt</button></div></div>`);document.getElementById('rIssue').onchange=showReturnLines}
function showReturnLines(){const issue=data.issues.find(x=>x.id===document.getElementById('rIssue').value);const box=document.getElementById('returnLines');if(!issue){box.innerHTML='<div class="empty">Select an invoice.</div>';return}box.innerHTML=issue.items.map(i=>`<div class="invoice-line"><div style="padding:10px;background:var(--s);border-radius:9px"><b>${esc(iname(i.itemId))}</b> • Issued ${i.qty}</div><input class="return-qty" data-item="${i.itemId}" type="number" min="0" max="${remaining(issue.id,i.itemId)}" value="0"><div class="small muted" style="padding-top:10px">Max ${remaining(issue.id,i.itemId)}</div></div>`).join('')}
function remaining(issueId,itemId){const issue=data.issues.find(x=>x.id===issueId);const orig=issue?.items.find(x=>x.itemId===itemId)?.qty||0;const ret=data.returns.filter(x=>x.issueId===issueId).flatMap(x=>x.items).filter(x=>x.itemId===itemId).reduce((n,x)=>n+Number(x.qty),0);return Math.max(0,orig-ret)}
function printIssue(id){const x=data.issues.find(i=>i.id===id);if(!x)return;const html=printShell(`<h1>${esc(data.shop.name)}</h1><p>${esc(data.shop.address)}<br>${esc(data.shop.mobile)}</p><hr><h2>Rental Issue Invoice</h2><p><b>Invoice:</b> ${esc(x.invoice)} &nbsp; <b>Date:</b> ${x.date}<br><b>Customer:</b> ${esc(cname(x.customerId))}</p><table><tr><th>Item</th><th>Qty</th><th>Rent/100</th><th>Amount</th></tr>${x.items.map(i=>`<tr><td>${esc(iname(i.itemId))}</td><td>${i.qty}</td><td>${money(i.rent)}</td><td>${money(i.amount)}</td></tr>`).join('')}</table><h2 style="text-align:right">Total: ${money(x.amount)}</h2>`);popupPrint(html)}
function printReport(){const html=printShell(`<h1>${esc(data.shop.name)}</h1><p>${esc(data.shop.address)}</p><h2>Inventory & Billing Report</h2><p>Generated ${today()}</p><table><tr><th>Invoice</th><th>Customer</th><th>Date</th><th>Amount</th></tr>${data.issues.map(x=>`<tr><td>${esc(x.invoice)}</td><td>${esc(cname(x.customerId))}</td><td>${x.date}</td><td>${money(x.amount)}</td></tr>`).join('')}</table>`);popupPrint(html)}
function printShell(body){return`<!doctype html><html><head><title>RentFlow Print</title><style>body{font-family:Arial;padding:30px;color:#111}table{width:100%;border-collapse:collapse;margin-top:20px}th,td{padding:9px;border:1px solid #ccc;text-align:left}h1{color:#007d69}</style><style><!-- rentflow-company-fix -->.company-logo{object-fit:cover}</style></head><body>${body}</body></html>`}
function popupPrint(html){const w=window.open('','_blank');if(!w)return alert('Please allow popups for printing.');w.document.write(html);w.document.close();w.focus();setTimeout(()=>w.print(),250)}
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});document.getElementById('menuBtn').onclick=()=>{if(innerWidth<901){const s=document.getElementById('side');s.style.display=s.style.display==='block'?'none':'block';s.style.position='fixed';s.style.top='68px';s.style.bottom='0';s.style.overflow='auto';s.style.boxShadow='10px 0 30px #0002'}};
function globalAction(a){if(a==='close')return closeModal();if(a==='add-line')return addLine();if(a==='save-item:')return saveItem('');if(a.startsWith('save-item:'))return saveItem(a.split(':')[1]);if(a==='save-customer:')return saveCustomer('');if(a.startsWith('save-customer:'))return saveCustomer(a.split(':')[1]);if(a==='save-invoice')return saveInvoice();if(a==='save-return')return saveReturn();act(a)}
function saveItem(id){const name=document.getElementById('fName').value.trim();if(!name)return alert('Item name is required.');const obj={id:id||uid(),name,code:document.getElementById('fCode').value.trim(),category:document.getElementById('fCat').value.trim()||'General',qty:Math.max(0,Number(document.getElementById('fQty').value||0)),rent:Math.max(0,Number(document.getElementById('fRent').value||0))};if(id){const n=data.items.findIndex(x=>x.id===id);if(n>=0)data.items[n]=obj}else data.items.push(obj);closeModal();save()}
function saveCustomer(id){const name=document.getElementById('cName').value.trim();if(!name)return alert('Customer name is required.');const obj={id:id||uid(),name,mobile:document.getElementById('cMobile').value.trim(),address:document.getElementById('cAddress').value.trim()};if(id){const n=data.customers.findIndex(x=>x.id===id);if(n>=0)data.customers[n]=obj}else data.customers.push(obj);closeModal();save()}
function saveInvoice(){const customerId=document.getElementById('iCustomer').value;if(!customerId)return alert('Select customer.');const lines=[...document.querySelectorAll('.invoice-line')].map(r=>({itemId:r.querySelector('.line-item').value,qty:Number(r.querySelector('.line-qty').value||0)})).filter(x=>x.itemId&&x.qty>0);if(!lines.length)return alert('Add at least one item.');for(const l of lines)if(l.qty>stock(l.itemId))return alert('Not enough stock for '+iname(l.itemId)+'.');let amount=0;const items=lines.map(l=>{const i=data.items.find(x=>x.id===l.itemId);const a=(Number(i.rent)*l.qty)/100;amount+=a;i.qty-=l.qty;return{itemId:l.itemId,qty:l.qty,rent:i.rent,amount:a}});const issue={id:uid(),invoice:'INV-'+Date.now().toString().slice(-7),customerId,date:document.getElementById('iDate').value||today(),items,amount};data.issues.push(issue);closeModal();save();go('issued')}
function saveReturn(){const issueId=document.getElementById('rIssue').value;if(!issueId)return alert('Select invoice.');const issue=data.issues.find(x=>x.id===issueId);const items=[...document.querySelectorAll('.return-qty')].map(e=>({itemId:e.dataset.item,qty:Number(e.value||0)})).filter(x=>x.qty>0);if(!items.length)return alert('Enter return quantity.');for(const x of items){if(x.qty>remaining(issueId,x.itemId))return alert('Return quantity exceeds remaining quantity.');const item=data.items.find(i=>i.id===x.itemId);if(item)item.qty+=x.qty}const amount=items.reduce((n,x)=>{const old=issue.items.find(i=>i.itemId===x.itemId);return n+(Number(old?.rent||0)*x.qty)/100},0);data.returns.push({id:uid(),number:'RET-'+Date.now().toString().slice(-7),issueId,invoice:issue.invoice,customerId:issue.customerId,date:today(),items,amount});closeModal();save();go('returns')}
const oldBind=bind;bind=function(){oldBind();document.querySelectorAll('[data-action]').forEach(b=>{b.onclick=()=>globalAction(b.dataset.action)});document.querySelectorAll('[data-go]').forEach(b=>{b.onclick=()=>go(b.dataset.go)})};
nav();render('dashboard');
</script>
