<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#008f78">
<title>RentFlow by PaliaAPK HUB</title>
<style>
:root{--e:#008f78;--ed:#006b5a;--es:#e7f6f1;--bg:#f5f8f7;--ink:#172521;--muted:#66756f;--line:#d8e5e1;--white:#fff;--danger:#c62828;--shadow:0 10px 28px rgba(0,52,43,.08)}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}.top{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 18px;position:sticky;top:0;z-index:20}.menu{border:0;background:transparent;font-size:28px}.brand{font-weight:900;font-size:18px}.layout{display:flex;min-height:calc(100vh - 68px)}.drawer{width:265px;background:#fff;border-right:1px solid var(--line);padding:16px;position:sticky;top:68px;height:calc(100vh - 68px)}.nav{display:grid;gap:6px}.nav button,.mobile button{border:0;background:transparent;text-align:left;padding:12px;border-radius:12px;font-weight:750}.nav button.active,.nav button:hover,.mobile button.active{background:var(--es);color:var(--ed)}.main{flex:1;padding:22px;min-width:0}.page{display:none}.page.active{display:block}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow);margin-bottom:16px}.head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}.head h2{margin:0;font-size:21px}.primary{border:0;background:var(--e);color:#fff;padding:10px 14px;border-radius:11px;font-weight:800}.danger{background:var(--danger)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.stat{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px}.num{font-size:28px;font-weight:900}.muted{color:var(--muted)}.shop{display:flex;gap:15px;align-items:center}.shoplogo{width:68px;height:68px;border-radius:17px;background:var(--es);display:grid;place-items:center;font-size:28px}.action{padding:22px;border:1px solid var(--line);border-radius:18px;background:#fff;box-shadow:var(--shadow);cursor:pointer}.action:hover{transform:translateY(-2px)}.icon{font-size:25px;margin-bottom:12px}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field label{display:block;font-size:13px;font-weight:800;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:#fff}.field textarea{min-height:85px}.full{grid-column:1/-1}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:11px 8px;border-bottom:1px solid var(--line);vertical-align:top}th{font-size:12px;color:var(--muted)}.tablewrap{overflow:auto}.empty{text-align:center;padding:35px;color:var(--muted)}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:var(--es);color:var(--ed);font-size:12px;font-weight:800}.modal{position:fixed;inset:0;background:rgba(0,0,0,.38);display:none;place-items:center;padding:18px;z-index:50}.modal.open{display:grid}.modalbox{background:#fff;border-radius:18px;width:min(760px,100%);max-height:90vh;overflow:auto;padding:20px}.mobile{display:none}.small{font-size:12px}.right{text-align:right}.invoice-items{display:grid;gap:8px}.itemrow{display:grid;grid-template-columns:2fr 90px 120px 42px;gap:8px;align-items:center}.itemrow input,.itemrow select{padding:9px;border:1px solid var(--line);border-radius:9px}.x{border:0;background:#fee;color:var(--danger);border-radius:8px;padding:8px}.notice{background:var(--es);padding:12px;border-radius:12px;margin-bottom:12px}.search{max-width:280px}
@media(max-width:900px){.drawer{display:none}.mobile{display:grid;position:fixed;bottom:10px;left:10px;right:10px;grid-template-columns:repeat(5,1fr);background:#fff;border:1px solid var(--line);border-radius:18px;padding:6px;z-index:30;box-shadow:var(--shadow)}.mobile button{text-align:center;font-size:11px}.main{padding:15px 15px 90px}.grid{grid-template-columns:repeat(2,1fr)}.stats{grid-template-columns:1fr 1fr 1fr}.formgrid{grid-template-columns:1fr}}
@media(max-width:560px){.grid,.stats{grid-template-columns:1fr}.itemrow{grid-template-columns:1fr 75px 100px 36px}.brand{font-size:15px}}
@media print{.top,.drawer,.mobile,.no-print{display:none!important}.main{padding:0}.page{display:none}.page.active{display:block}.card{box-shadow:none;border:0}}
</style></head>
<body>
<header class="top"><button class="menu" onclick="toggleDrawer()">☰</button><div class="brand">RentFlow by PaliaAPK HUB</div></header>
<div class="layout"><aside class="drawer" id="drawer"><nav class="nav" id="nav"></nav><p class="muted small">By PaliaAPK HUB • Developer by shanpalia</p></aside><main class="main">
<section id="dashboard" class="page active"></section><section id="inventory" class="page"></section><section id="customers" class="page"></section><section id="issued" class="page"></section><section id="returns" class="page"></section><section id="register" class="page"></section><section id="reports" class="page"></section><section id="shop" class="page"></section><section id="settings" class="page"></section>
</main></div><nav class="mobile" id="mobile"></nav>
<div class="modal" id="modal"><div class="modalbox" id="modalbox"></div></div>
<script>
const KEY='rentflow_v1';let db=JSON.parse(localStorage.getItem(KEY)||'null')||{shop:{name:'Your Shop',owner:'',mobile:'',address:''},items:[],customers:[],issues:[],returns:[],settings:{currency:'₹'}};function save(){localStorage.setItem(KEY,JSON.stringify(db));render()}
const navs=[['dashboard','Dashboard'],['inventory','Inventory'],['customers','Customers / Parties'],['issued','Issued / New Invoice'],['returns','Returns'],['register','Inventory Register'],['reports','Reports / Bills'],['shop','Shop / Company'],['settings','Settings / About']];function nav(){document.getElementById('nav').innerHTML=navs.map(x=>`<button data-go="${x[0]}">${x[1]}</button>`).join('');document.getElementById('mobile').innerHTML=navs.slice(0,5).map(x=>`<button data-go="${x[0]}">${x[1].split(' ')[0]}</button>`).join('');document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go))}function go(id){document.querySelectorAll('.page').forEach(x=>x.classList.toggle('active',x.id===id));document.querySelectorAll('[data-go]').forEach(x=>x.classList.toggle('active',x.dataset.go===id));renderPage(id);window.scrollTo(0,0);if(innerWidth<901)document.getElementById('drawer').style.display='none'}function toggleDrawer(){if(innerWidth<901){let d=document.getElementById('drawer');d.style.display=d.style.display==='block'?'none':'block';d.style.position='fixed';d.style.top='68px';d.style.bottom='0';d.style.zIndex=25;d.style.overflow='auto';d.style.boxShadow='10px 0 30px #0002'}}
function money(n){return `${db.settings.currency||'₹'}${Number(n||0).toFixed(2)}`}function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function today(){return new Date().toISOString().slice(0,10)}function days(a,b){let d=Math.ceil((new Date(b)-new Date(a))/86400000);return Math.max(1,d)}
function render(){nav();renderPage(document.querySelector('.page.active')?.id||'dashboard')}function renderPage(id){({dashboard:dashboard,inventory:inventory,customers:customers,issued:issued,returns:returns,register:register,reports:reports,shop:shop,settings:settings}[id])()}
function dashboard(){dashboard.innerHTML=`<div class="card shop"><div class="shoplogo">🏪</div><div style="flex:1"><h2 style="margin:0">${esc(db.shop.name||'Your Shop')}</h2><div class="muted">${esc(db.shop.owner||'Owner')} • ${esc(db.shop.mobile||'Mobile')}</div><div class="muted small">${esc(db.shop.address||'Add your shop address in Shop / Company')}</div></div><button class="primary" onclick="go('shop')">Edit Shop</button></div><h1>Quick Actions</h1><p class="muted">Real local data • works without a server</p><div class="grid"><div class="action" onclick="go('issued')"><div class="icon">🧾</div><b>New Invoice</b><div class="muted">Issue items to party</div></div><div class="action" onclick="go('returns')"><div class="icon">↩</div><b>Return</b><div class="muted">Receive issued items</div></div><div class="action" onclick="modal(itemForm())"><div class="icon">＋</div><b>Add Item</b><div class="muted">Inventory master</div></div><div class="action" onclick="modal(customerForm())"><div class="icon">👤</div><b>Add Customer</b><div class="muted">Party master</div></div><div class="action" onclick="go('inventory')"><div class="icon">▦</div><b>Inventory</b><div class="muted">Current stock</div></div><div class="action" onclick="go('reports')"><div class="icon">📄</div><b>Reports / Bills</b><div class="muted">Preview / print</div></div></div><div class="stats" style="margin-top:18px"><div class="stat"><div class="muted">Items</div><div class="num">${db.items.length}</div></div><div class="stat"><div class="muted">Parties</div><div class="num">${db.customers.length}</div></div><div class="stat"><div class="muted">Issued</div><div class="num">${db.issues.length}</div></div></div>`}
function inventory(){inventory.innerHTML=`<div class="card"><div class="head"><h2>Inventory / Items</h2><button class="primary" onclick="modal(itemForm())">＋ Add Item</button></div><div class="tablewrap"><table><thead><tr><th>Code</th><th>Item</th><th>Qty</th><th>Rent / 100</th><th>Action</th></tr></thead><tbody>${db.items.length?db.items.map(i=>`<tr><td>${esc(i.code)}</td><td><b>${esc(i.name)}</b></td><td>${i.qty}</td><td>${money(i.rent)}</td><td><button onclick="modal(itemForm('${i.id}'))">Edit</button> <button class="x" onclick="delItem('${i.id}')">Delete</button></td></tr>`).join(''):`<tr><td colspan="5" class="empty">No inventory items yet.</td></tr>`}</tbody></table></div></div>`}
function itemForm(id=''){let i=db.items.find(x=>x.id===id)||{name:'',code:'',qty:0,rent:15};return `<div class="head"><h2>${id?'Edit':'Add'} Item</h2><button onclick="closeModal()">✕</button></div><form onsubmit="saveItem(event,'${id}')"><div class="formgrid"><div class="field"><label>Item Name *</label><input id="iname" required value="${esc(i.name)}"></div><div class="field"><label>Item Code</label><input id="icode" value="${esc(i.code)}"></div><div class="field"><label>Quantity *</label><input id="iqty" type="number" min="0" required value="${i.qty}"></div><div class="field"><label>Rent / 100 *</label><input id="irent" type="number" min="0" step="0.01" required value="${i.rent}"></div></div><br><button class="primary">Save Item</button></form>`}function saveItem(e,id){e.preventDefault();let x={id:id||uid(),name:iname.value.trim(),code:icode.value.trim(),qty:+iqty.value,rent:+irent.value};let old=db.items.findIndex(i=>i.id===x.id);if(old>=0)db.items[old]=x;else db.items.push(x);closeModal();save()}function delItem(id){if(confirm('Delete this item?')){db.items=db.items.filter(i=>i.id!==id);save()}}
function customers(){customers.innerHTML=`<div class="card"><div class="head"><h2>Customers / Parties</h2><button class="primary" onclick="modal(customerForm())">＋ Add Customer</button></div><div class="tablewrap"><table><thead><tr><th>Name</th><th>Mobile</th><th>Address</th><th>Action</th></tr></thead><tbody>${db.customers.length?db.customers.map(c=>`<tr><td><b>${esc(c.name)}</b></td><td>${esc(c.mobile)}</td><td>${esc(c.address)}</td><td><button onclick="modal(customerForm('${c.id}'))">Edit</button> <button class="x" onclick="delCustomer('${c.id}')">Delete</button></td></tr>`).join(''):`<tr><td colspan="4" class="empty">No parties yet.</td></tr>`}</tbody></table></div></div>`}function customerForm(id=''){let c=db.customers.find(x=>x.id===id)||{name:'',mobile:'',address:''};return `<div class="head"><h2>${id?'Edit':'Add'} Customer</h2><button onclick="closeModal()">✕</button></div><form onsubmit="saveCustomer(event,'${id}')"><div class="formgrid"><div class="field"><label>Name *</label><input id="cname" required value="${esc(c.name)}"></div><div class="field"><label>Mobile</label><input id="cmobile" value="${esc(c.mobile)}"></div><div class="field full"><label>Address</label><textarea id="caddress">${esc(c.address)}</textarea></div></div><br><button class="primary">Save Customer</button></form>`}function saveCustomer(e,id){e.preventDefault();let x={id:id||uid(),name:cname.value.trim(),mobile:cmobile.value.trim(),address:caddress.value.trim()};let n=db.customers.findIndex(c=>c.id===x.id);if(n>=0)db.customers[n]=x;else db.customers.push(x);closeModal();save()}function delCustomer(id){if(confirm('Delete this customer?')){db.customers=db.customers.filter(c=>c.id!==id);save()}}
let issueRows=[];function issued(){issued.innerHTML=`<div class="card"><div class="head"><h2>Issued / New Invoice</h2><button class="primary" onclick="newInvoice()">＋ New Invoice</button></div>${db.issues.length?`<div class="tablewrap"><table><thead><tr><th>Invoice</th><th>Customer</th><th>Date</th><th>Items</th><th>Total Qty</th><th>Action</th></tr></thead><tbody>${db.issues.map(x=>`<tr><td><b>${esc(x.invoice)}</b></td><td>${esc(cnameBy(x.customerId))}</td><td>${x.date}</td><td>${x.items.length}</td><td>${x.items.reduce((a,b)=>a+b.qty,0)}</td><td><button onclick="printIssue('${x.id}')">Print</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No invoice created yet.</div>'}</div>`}function cnameBy(id){return db.customers.find(c=>c.id===id)?.name||'Unknown'}function newInvoice(){if(!db.customers.length||!db.items.length)return modal(`<div class="head"><h2>Cannot create invoice</h2><button onclick="closeModal()">✕</button></div><div class="notice">First add at least one customer and one inventory item.</div>`);issueRows=[{itemId:db.items[0].id,qty:1}];modal(invoiceForm())}function invoiceForm(){return `<div class="head"><h2>New Invoice</h2><button onclick="closeModal()">✕</button></div><form onsubmit="saveInvoice(event)"><div class="formgrid"><div class="field"><label>Customer *</label><select id="icustomer" required>${db.customers.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div><div class="field"><label>Invoice Number *</label><input id="iinvoice" required value="INV-${Date.now()}"></div><div class="field"><label>Issue Date *</label><input id="idate" type="date" required value="${today()}"></div></div><h3>Items</h3><div id="rows" class="invoice-items">${issueRows.map((r,n)=>rowHtml(r,n)).join('')}</div><br><button type="button" onclick="addIssueRow()">＋ Add item row</button><hr><div class="right"><b>Issued quantity: <span id="totalq">${issueRows.reduce((a,r)=>a+r.qty,0)}</span></b></div><br><button class="primary">Save Invoice</button></form>`}function rowHtml(r,n){return `<div class="itemrow"><select onchange="issueRows[${n}].itemId=this.value">${db.items.map(i=>`<option value="${i.id}" ${i.id===r.itemId?'selected':''}>${esc(i.name)} (stock ${i.qty})</option>`).join('')}</select><input type="number" min="1" max="${db.items.find(i=>i.id===r.itemId)?.qty||1}" value="${r.qty}" onchange="issueRows[${n}].qty=+this.value;document.getElementById('totalq').textContent=issueRows.reduce((a,r)=>a+r.qty,0)"><span class="pill">${money(db.items.find(i=>i.id===r.itemId)?.rent||0)}/100</span><button type="button" class="x" onclick="issueRows.splice(${n},1);document.getElementById('rows').innerHTML=issueRows.map((r,j)=>rowHtml(r,j)).join('')">✕</button></div>`}function addIssueRow(){issueRows.push({itemId:db.items[0].id,qty:1});document.getElementById('rows').innerHTML=issueRows.map((r,j)=>rowHtml(r,j)).join('')}function saveInvoice(e){e.preventDefault();let used={};for(let r of issueRows){if(!r.qty||r.qty<1)return alert('Quantity must be at least 1');used[r.itemId]=(used[r.itemId]||0)+r.qty}for(let id in used){let it=db.items.find(i=>i.id===id);if(!it||used[id]>it.qty)return alert('Insufficient stock for '+(it?.name||'item'))}for(let id in used)db.items.find(i=>i.id===id).qty-=used[id];db.issues.push({id:uid(),invoice:iinvoice.value,customerId:icustomer.value,date:idate.value,items:issueRows.map(r=>({itemId:r.itemId,qty:r.qty,rent:db.items.find(i=>i.id===r.itemId).rent}))});closeModal();save();go('issued')}
function returns(){let open=db.issues.filter(x=>x.items.some(i=>remaining(x.id,i.itemId)>0));returns.innerHTML=`<div class="card"><div class="head"><h2>Returns / Receive</h2></div>${open.length?open.map(x=>`<div class="card" style="box-shadow:none;background:#f9fbfa"><b>${esc(x.invoice)}</b> • ${esc(cnameBy(x.customerId))} • ${x.date}<div class="row" style="margin-top:8px">${x.items.map(i=>`<span class="pill">${esc(db.items.find(q=>q.id===i.itemId)?.name||'Item')}: ${remaining(x.id,i.itemId)} left</span>`).join('')}</div><br><button class="primary" onclick="modal(returnForm('${x.id}'))">Receive Return</button></div>`).join(''):'<div class="empty">No outstanding issued items.</div>'}</div>`}function remaining(issueId,itemId){let x=db.issues.find(i=>i.id===issueId),issued=x?.items.find(i=>i.itemId===itemId)?.qty||0;let returned=db.returns.filter(r=>r.issueId===issueId).flatMap(r=>r.items).filter(i=>i.itemId===itemId).reduce((a,i)=>a+i.qty,0);return Math.max(0,issued-returned)}function returnForm(issueId){let x=db.issues.find(i=>i.id===issueId);return `<div class="head"><h2>Return ${esc(x.invoice)}</h2><button onclick="closeModal()">✕</button></div><form onsubmit="saveReturn(event,'${issueId}')"><div class="notice">Issued Date: ${x.date} • Return Date: ${today()} • Rent Days: <b>${days(x.date,today())}</b></div><div class="invoice-items">${x.items.map((i,n)=>{let max=remaining(x.id,i.itemId);return `<div class="itemrow"><span>${esc(db.items.find(q=>q.id===i.itemId)?.name||'Item')}</span><input id="rq${n}" type="number" min="0" max="${max}" value="${max}"><span>${max} available</span><span></span><input type="hidden" id="rid${n}" value="${i.itemId}"></div>`}).join('')}</div><br><div class="formgrid"><div class="field"><label>Manual Return Amount (optional)</label><input id="ramount" type="number" step="0.01"></div><div class="field"><label>Notes</label><input id="rnotes"></div></div><br><button class="primary">Save Return & Receipt</button></form>`}function saveReturn(e,issueId){e.preventDefault();let x=db.issues.find(i=>i.id===issueId),out=[];x.items.forEach((it,n)=>{let q=+document.getElementById('rq'+n).value||0;if(q>0)out.push({itemId:it.itemId,qty:q,rent:it.rent})});if(!out.length)return alert('Select return quantity');out.forEach(i=>db.items.find(x=>x.id===i.itemId).qty+=i.qty);let d=days(x.date,today()),calc=out.reduce((a,i)=>a+i.qty*i.rent*d/100,0),manual=+ramount.value;db.returns.push({id:uid(),issueId,customerId:x.customerId,date:today(),days:d,amount:manual>0?manual:calc,notes:rnotes.value,items:out});closeModal();save();go('returns')}
function register(){register.innerHTML=`<div class="card"><div class="head"><h2>Inventory Register</h2></div><div class="tablewrap"><table><thead><tr><th>Item</th><th>Code</th><th>Current Stock</th><th>Issued Total</th><th>Returned Total</th></tr></thead><tbody>${db.items.map(i=>{let iss=db.issues.flatMap(x=>x.items).filter(x=>x.itemId===i.id).reduce((a,x)=>a+x.qty,0),ret=db.returns.flatMap(x=>x.items).filter(x=>x.itemId===i.id).reduce((a,x)=>a+x.qty,0);return `<tr><td>${esc(i.name)}</td><td>${esc(i.code)}</td><td><b>${i.qty}</b></td><td>${iss}</td><td>${ret}</td></tr>`}).join('')||'<tr><td colspan="5" class="empty">No inventory records.</td></tr>'}</tbody></table></div></div>`}
function reports(){reports.innerHTML=`<div class="card"><div class="head"><h2>Reports / Bills</h2><button class="primary" onclick="printReport()">Print Report</button></div><div class="stats"><div class="stat"><div class="muted">Invoices</div><div class="num">${db.issues.length}</div></div><div class="stat"><div class="muted">Returns</div><div class="num">${db.returns.length}</div></div><div class="stat"><div class="muted">Return Amount</div><div class="num">${money(db.returns.reduce((a,x)=>a+x.amount,0))}</div></div></div><h3>Invoices</h3><div class="tablewrap"><table><thead><tr><th>Invoice</th><th>Customer</th><th>Date</th><th>Action</th></tr></thead><tbody>${db.issues.map(x=>`<tr><td>${esc(x.invoice)}</td><td>${esc(cnameBy(x.customerId))}</td><td>${x.date}</td><td><button onclick="printIssue('${x.id}')">Preview / Print</button></td></tr>`).join('')||'<tr><td colspan="4" class="empty">No invoices.</td></tr>'}</tbody></table></div></div>`}
function shop(){shop.innerHTML=`<div class="card"><div class="head"><h2>Shop / Company</h2></div><form onsubmit="saveShop(event)"><div class="formgrid"><div class="field"><label>Shop Name *</label><input id="sname" required value="${esc(db.shop.name)}"></div><div class="field"><label>Owner</label><input id="sowner" value="${esc(db.shop.owner)}"></div><div class="field"><label>Mobile</label><input id="smobile" value="${esc(db.shop.mobile)}"></div><div class="field full"><label>Address</label><textarea id="saddress">${esc(db.shop.address)}</textarea></div></div><br><button class="primary">Save Shop Details</button></form></div>`}function saveShop(e){e.preventDefault();db.shop={name:sname.value.trim(),owner:sowner.value.trim(),mobile:smobile.value.trim(),address:saddress.value.trim()};save();alert('Shop details saved')}
function settings(){settings.innerHTML=`<div class="card"><div class="head"><h2>Settings / About</h2></div><div class="formgrid"><div class="field"><label>Currency Symbol</label><input id="currency" value="${esc(db.settings.currency)}"></div></div><br><button class="primary" onclick="saveSettings()">Save Settings</button><hr><p><b>RentFlow</b> • PaliaAPK HUB</p><p class="muted">Developer by shanpalia</p><button class="primary danger" onclick="resetData()">Reset All Local Data</button></div>`}function saveSettings(){db.settings.currency=currency.value.trim()||'₹';save();alert('Settings saved')}function resetData(){if(confirm('This will permanently delete all browser data. Continue?')){localStorage.removeItem(KEY);location.reload()}}
function modal(html){document.getElementById('modalbox').innerHTML=html;document.getElementById('modal').classList.add('open')}function closeModal(){document.getElementById('modal').classList.remove('open')}document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')closeModal()}
function printIssue(id){let x=db.issues.find(i=>i.id===id);let rows=x.items.map(i=>`<tr><td>${esc(db.items.find(q=>q.id===i.itemId)?.name||'Item')}</td><td>${i.qty}</td><td>${money(i.rent)}</td></tr>`).join('');printWindow(`<h1>${esc(db.shop.name)}</h1><p>${esc(db.shop.address)}<br>${esc(db.shop.mobile)}</p><h2>Issue Invoice: ${esc(x.invoice)}</h2><p>Customer: ${esc(cnameBy(x.customerId))} | Date: ${x.date}</p><table><tr><th>Item</th><th>Qty</th><th>Rent/100</th></tr>${rows}</table><p>Rent days are calculated on return.</p>`)}function printReport(){printWindow(`<h1>${esc(db.shop.name)} — RentFlow Report</h1><p>Generated: ${today()}</p><p>Total invoices: ${db.issues.length}<br>Total returns: ${db.returns.length}<br>Total return amount: ${money(db.returns.reduce((a,x)=>a+x.amount,0))}</p>`)}function printWindow(body){let w=open('','_blank');w.document.write(`<html><head><title>RentFlow</title><style>body{font-family:Arial;padding:30px}table{width:100%;border-collapse:collapse}td,th{border:1px solid #ccc;padding:8px;text-align:left}</style></head><body>${body}</body></html>`);w.document.close();w.focus();setTimeout(()=>w.print(),300)}
nav();render();
</script></body></html>
