<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#008f78">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<title>RentFlow • PaliaAPK HUB</title>
<style>
:root{--e:#008f78;--ed:#006b59;--es:#e7f7f3;--bg:#f3f7f6;--ink:#16221f;--muted:#70807c;--line:#d9e5e2;--card:#fff;--danger:#c62828;--shadow:0 5px 20px #005b4b12}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px Arial,system-ui,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.top{height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 18px;gap:14px;position:fixed;top:0;left:0;right:0;z-index:20}.hamb{border:0;background:transparent;font-size:25px}.brand{font-size:19px;font-weight:900}.layout{display:flex;padding-top:64px;min-height:100vh}.side{width:265px;flex:0 0 265px;background:#fff;border-right:1px solid var(--line);position:fixed;top:64px;bottom:0;overflow:auto;padding:15px}.nav{display:grid;gap:4px}.nav button{border:0;background:transparent;text-align:left;padding:12px;border-radius:10px;font-weight:800;color:var(--ink)}.nav button:hover,.nav button.active{background:var(--es);color:var(--ed)}.group{font-size:10px;font-weight:900;color:var(--muted);letter-spacing:.08em;padding:15px 10px 6px}.content{margin-left:265px;width:calc(100% - 265px);min-width:0;padding:22px}.page-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.page-title h1{margin:0;font-size:28px}.card,.stat,.quick{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}.card{padding:18px;margin-bottom:16px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}.stat{padding:17px}.stat .label{color:var(--muted);font-weight:700}.stat .n{font-size:27px;font-weight:950;margin-top:7px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.quick{padding:18px;cursor:pointer}.quick:hover{border-color:var(--e)}.ico{font-size:25px;margin-bottom:8px}.muted{color:var(--muted)}.small{font-size:12px}.btn{border:0;border-radius:9px;padding:10px 14px;font-weight:800}.primary{background:var(--e);color:#fff}.secondary{background:var(--es);color:var(--ed)}.ghost{background:#fff;border:1px solid var(--line)}.danger{background:#fff0f0;color:var(--danger)}.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.search{flex:1;min-width:240px}.search input,.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:9px;background:#fff;outline:0}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--e);box-shadow:0 0 0 3px var(--es)}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{padding:12px 9px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}th{font-size:11px;color:var(--muted);text-transform:uppercase}.pill{background:var(--es);color:var(--ed);padding:4px 8px;border-radius:20px;font-size:11px;font-weight:900}.form{display:grid;grid-template-columns:1fr 1fr;gap:14px}.full{grid-column:1/-1}.field label{display:block;font-size:12px;font-weight:850;margin-bottom:6px}.section-title{font-size:16px;font-weight:900;margin:6px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--line)}.logo{width:90px;height:90px;border-radius:14px;background:var(--es);display:grid;place-items:center;overflow:hidden;font-size:34px}.logo img{width:100%;height:100%;object-fit:cover}.hero{display:flex;gap:16px;align-items:center}.split{display:grid;grid-template-columns:1.4fr .6fr;gap:16px}.empty{text-align:center;padding:45px;color:var(--muted)}.modal{display:none;position:fixed;inset:0;background:#0007;z-index:50;place-items:center;padding:18px}.modal.open{display:grid}.modalbox{background:#fff;width:min(1000px,100%);max-height:94vh;overflow:auto;border-radius:16px;padding:20px}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.modalhead h2{margin:0}.close{border:0;background:#eef2f1;border-radius:8px;padding:7px 11px;font-size:18px}.mobile-nav{display:none}@media(max-width:1000px){.side{display:none}.content{margin-left:0;width:100%;padding:18px 14px 90px}.stats,.grid4{grid-template-columns:1fr 1fr}.split{grid-template-columns:1fr}.mobile-nav{display:grid;position:fixed;left:8px;right:8px;bottom:8px;background:#fff;border:1px solid var(--line);border-radius:15px;padding:5px;grid-template-columns:repeat(5,1fr);z-index:30;box-shadow:var(--shadow)}.mobile-nav button{border:0;background:transparent;padding:7px 2px;font-size:10px;border-radius:9px}.mobile-nav .active{background:var(--es);color:var(--ed);font-weight:900}}@media(max-width:650px){.stats,.grid4,.form{grid-template-columns:1fr}.full{grid-column:auto}.hero{align-items:flex-start}.page-title h1{font-size:22px}}
</style>
</head>
<body>
<header class="top"><button class="hamb" id="hamb">☰</button><div class="brand">RentFlow <span class="muted">• PaliaAPK HUB</span></div></header>
<div class="layout"><aside class="side"><nav id="nav" class="nav"></nav><div class="small muted" style="margin:18px 8px">By PaliaAPK HUB<br>Developer by shanpalia</div></aside><main id="app" class="content"></main></div>
<nav id="mobile" class="mobile-nav"></nav>
<div id="modal" class="modal"><div id="modalBox" class="modalbox"></div></div>
<script>
'use strict';
const KEY='rentflow_web_v5';
const menu=[['dashboard','⌂','Dashboard'],['inventory','▦','Inventory / Items'],['customers','♙','Customers / Parties'],['issued','↗','Issued / New Invoice'],['returns','↩','Returns / Receive'],['register','▤','Inventory Register'],['reports','▧','Reports / Bills'],['shop','⌂','Shop / Company'],['settings','⚙','Settings / About']];
const groups=[['MAIN',['dashboard']],['MASTERS',['inventory','customers']],['TRANSACTIONS',['issued','returns']],['REPORTS',['register','reports']],['SYSTEM',['shop','settings']]];
const blank=()=>({shop:{name:'',owner:'',mobile:'',alternateMobile:'',email:'',address:'',city:'',state:'',pin:'',gstin:'',pan:'',businessType:'',invoicePrefix:'INV',logo:'',signature:'',bankName:'',accountNumber:'',ifsc:'',upi:''},items:[],customers:[],issues:[],returns:[],settings:{currency:'₹'}});
let data=load();let current='dashboard';
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x){const b=blank();return Object.assign(b,x,{shop:Object.assign(b.shop,x.shop||{}),settings:Object.assign(b.settings,x.settings||{}),items:Array.isArray(x.items)?x.items:[],customers:Array.isArray(x.customers)?x.customers:[],issues:Array.isArray(x.issues)?x.issues:[],returns:Array.isArray(x.returns)?x.returns:[]})}}catch(e){}return blank()}
function persist(){localStorage.setItem(KEY,JSON.stringify(data))}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function money(v){return (data.settings.currency||'₹')+Number(v||0).toFixed(2)}
function today(){return new Date().toISOString().slice(0,10)}
function cname(id){const x=data.customers.find(a=>a.id===id);return x?x.name:'Unknown party'}
function iname(id){const x=data.items.find(a=>a.id===id);return x?x.name:'Unknown item'}
function nav(){let h='';groups.forEach(g=>{h+='<div class="group">'+g[0]+'</div>';g[1].forEach(id=>{const p=menu.find(x=>x[0]===id);h+='<button data-page="'+id+'" class="'+(current===id?'active':'')+'"><span style="display:inline-block;width:28px">'+p[1]+'</span>'+p[2]+'</button>'})});document.getElementById('nav').innerHTML=h;document.getElementById('mobile').innerHTML=menu.slice(0,5).map(p=>'<button data-page="'+p[0]+'" class="'+(current===p[0]?'active':'')+'">'+p[1]+'<br>'+p[2].split(' ')[0]+'</button>').join('');document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page))}
function go(p){current=menu.some(x=>x[0]===p)?p:'dashboard';render()}
function render(){nav();document.getElementById('app').innerHTML=pages[current]();bind()}
function bind(){document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>action(b.dataset.action));document.querySelectorAll('[data-page2]').forEach(b=>b.onclick=()=>go(b.dataset.page2))}
function title(t,button=''){return '<div class="page-title"><h1>'+t+'</h1>'+button+'</div>'}
function dashboard(){const qty=data.items.reduce((n,x)=>n+Number(x.qty||0),0),bill=data.issues.reduce((n,x)=>n+Number(x.amount||0),0);return title('Dashboard','<button class="btn primary" data-action="invoice">＋ New Invoice</button>')+'<div class="card hero"><div class="logo">'+(data.shop.logo?'<img src="'+data.shop.logo+'">':'🏪')+'</div><div style="flex:1"><h2 style="margin:0 0 5px">'+esc(data.shop.name||'Your Shop')+'</h2><div class="muted">'+esc(data.shop.owner||'Shop Owner')+' '+(data.shop.mobile?'• '+esc(data.shop.mobile):'')+'</div><div class="small muted">'+esc(data.shop.address||'Add complete company details from Shop / Company')+'</div></div><button class="btn secondary" data-page2="shop">Company Settings</button></div><div class="stats"><div class="stat"><div class="label">Inventory Items</div><div class="n">'+data.items.length+'</div></div><div class="stat"><div class="label">Current Quantity</div><div class="n">'+qty+'</div></div><div class="stat"><div class="label">Customers / Parties</div><div class="n">'+data.customers.length+'</div></div><div class="stat"><div class="label">Rental Billing</div><div class="n">'+money(bill)+'</div></div></div><div class="card"><h2 style="margin-top:0">Quick Actions</h2><div class="grid4"><div class="quick" data-action="invoice"><div class="ico">🧾</div><b>New Invoice</b><div class="muted small">Issue rental stock</div></div><div class="quick" data-action="return"><div class="ico">↩</div><b>Receive Return</b><div class="muted small">Receive issued items</div></div><div class="quick" data-action="item"><div class="ico">＋</div><b>Add Item</b><div class="muted small">Inventory master</div></div><div class="quick" data-action="customer"><div class="ico">👤</div><b>Add Party</b><div class="muted small">Customer master</div></div></div></div><div class="split"><div class="card"><h3>Recent Invoices</h3>'+ (data.issues.length?data.issues.slice().reverse().slice(0,7).map(x=>'<div style="display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)"><b>'+esc(x.invoice)+'</b><span>'+esc(cname(x.customerId))+'</span><span style="margin-left:auto">'+money(x.amount)+'</span></div>').join(''):'<div class="empty">No invoices yet.</div>')+'</div><div class="card"><h3>Low Stock</h3>'+ (data.items.filter(x=>Number(x.qty)<=5).map(x=>'<div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)"><span>'+esc(x.name)+'</span><span class="pill">'+x.qty+'</span></div>').join('')||'<div class="empty">No low-stock items.</div>')+'</div></div>'}
function inventory(){return title('Inventory / Items','<button class="btn primary" data-action="item">＋ Add Item</button>')+'<div class="stats"><div class="stat"><div class="label">Total Items</div><div class="n">'+data.items.length+'</div></div><div class="stat"><div class="label">Current Quantity</div><div class="n">'+data.items.reduce((n,x)=>n+Number(x.qty||0),0)+'</div></div><div class="stat"><div class="label">Low Stock</div><div class="n">'+data.items.filter(x=>Number(x.qty||0)<=5).length+'</div></div><div class="stat"><div class="label">Categories</div><div class="n">'+new Set(data.items.map(x=>x.category||'General')).size+'</div></div></div><div class="card"><div class="toolbar"><div class="search"><input id="itemSearch" placeholder="Search item, code or category..." oninput="filterItems()"></div></div><div class="tablewrap"><table><thead><tr><th>Item</th><th>Code</th><th>Category</th><th>Quantity</th><th>Rent / Day</th><th>Actions</th></tr></thead><tbody id="itemRows">'+itemRows(data.items)+'</tbody></table></div></div>'}
function itemRows(a){return a.length?a.map(x=>'<tr><td><b>'+esc(x.name)+'</b></td><td>'+esc(x.code)+'</td><td>'+esc(x.category||'General')+'</td><td><span class="pill">'+Number(x.qty||0)+'</span></td><td>'+money(x.rent)+'</td><td><button class="btn ghost" onclick="openItem(\''+x.id+'\')">Edit</button> <button class="btn danger" onclick="removeItem(\''+x.id+'\')">Delete</button></td></tr>').join(''):'<tr><td colspan="6" class="empty">No inventory items. Add your first item.</td></tr>'}
function customers(){return title('Customers / Parties','<button class="btn primary" data-action="customer">＋ Add Party</button>')+'<div class="card"><div class="tablewrap"><table><thead><tr><th>Name</th><th>Mobile</th><th>Email</th><th>Address</th><th>Actions</th></tr></thead><tbody>'+ (data.customers.length?data.customers.map(x=>'<tr><td><b>'+esc(x.name)+'</b></td><td>'+esc(x.mobile)+'</td><td>'+esc(x.email)+'</td><td>'+esc(x.address)+'</td><td><button class="btn ghost" onclick="openCustomer(\''+x.id+'\')">Edit</button> <button class="btn danger" onclick="removeCustomer(\''+x.id+'\')">Delete</button></td></tr>').join(''):'<tr><td colspan="5" class="empty">No parties added.</td></tr>')+'</tbody></table></div></div>'}
function issued(){return title('Issued / New Invoice','<button class="btn primary" data-action="invoice">＋ New Invoice</button>')+'<div class="card"><div class="tablewrap"><table><thead><tr><th>Invoice</th><th>Date</th><th>Party</th><th>Items</th><th>Amount</th></tr></thead><tbody>'+(data.issues.length?data.issues.slice().reverse().map(x=>'<tr><td><b>'+esc(x.invoice)+'</b></td><td>'+esc(x.date)+'</td><td>'+esc(cname(x.customerId))+'</td><td>'+x.items.length+'</td><td>'+money(x.amount)+'</td></tr>').join(''):'<tr><td colspan="5" class="empty">No issued invoices.</td></tr>')+'</tbody></table></div></div>'}
function returns(){return title('Returns / Receive','<button class="btn primary" data-action="return">＋ Receive Return</button>')+'<div class="card"><div class="tablewrap"><table><thead><tr><th>Return No.</th><th>Date</th><th>Party</th><th>Invoice</th><th>Amount</th></tr></thead><tbody>'+(data.returns.length?data.returns.slice().reverse().map(x=>'<tr><td><b>'+esc(x.number)+'</b></td><td>'+esc(x.date)+'</td><td>'+esc(cname(x.customerId))+'</td><td>'+esc(x.issueInvoice)+'</td><td>'+money(x.amount)+'</td></tr>').join(''):'<tr><td colspan="5" class="empty">No returns received.</td></tr>')+'</tbody></table></div></div>'}
function register(){return title('Inventory Register')+'<div class="card"><div class="tablewrap"><table><thead><tr><th>Item</th><th>Code</th><th>Category</th><th>Current Quantity</th><th>Rent / Day</th></tr></thead><tbody>'+(data.items.length?data.items.map(x=>'<tr><td>'+esc(x.name)+'</td><td>'+esc(x.code)+'</td><td>'+esc(x.category||'General')+'</td><td>'+x.qty+'</td><td>'+money(x.rent)+'</td></tr>').join(''):'<tr><td colspan="5" class="empty">No inventory records.</td></tr>')+'</tbody></table></div></div>'}
function reports(){const total=data.issues.reduce((n,x)=>n+Number(x.amount||0),0);return title('Reports / Bills')+'<div class="stats"><div class="stat"><div class="label">Invoices</div><div class="n">'+data.issues.length+'</div></div><div class="stat"><div class="label">Returns</div><div class="n">'+data.returns.length+'</div></div><div class="stat"><div class="label">Gross Rental</div><div class="n">'+money(total)+'</div></div><div class="stat"><div class="label">Parties</div><div class="n">'+data.customers.length+'</div></div></div><div class="card"><h2>Billing Summary</h2><p class="muted">Use the issued invoice register above to review rental transactions. Printing can be added from the invoice workflow.</p></div>'}
function shop(){const s=data.shop;return title('Shop / Company','<button class="btn primary" data-action="save-shop">Save Company</button>')+'<div class="card"><div class="hero"><div class="logo" id="logoPreview">'+(s.logo?'<img src="'+s.logo+'">':'🏪')+'</div><div><h2 style="margin:0">Company Master</h2><div class="muted">Complete shop details used across RentFlow invoices and reports.</div><label class="btn secondary" style="display:inline-block;margin-top:8px"><input id="logoFile" type="file" accept="image/png,image/jpeg,image/webp" hidden>Upload Logo</label></div></div></div><div class="card"><div class="section-title">Business Details</div><div class="form">'+field('Company / Shop Name','shopName',s.name)+field('Owner Name','owner',s.owner)+field('Mobile','mobile',s.mobile)+field('Alternate Mobile','alternateMobile',s.alternateMobile)+field('Email','email',s.email)+field('Business Type','businessType',s.businessType)+field('Address','address',s.address,'full')+field('City','city',s.city)+field('State','state',s.state)+field('PIN Code','pin',s.pin)+field('GSTIN','gstin',s.gstin)+field('PAN','pan',s.pan)+'</div></div><div class="card"><div class="section-title">Invoice & Bank Details</div><div class="form">'+field('Invoice Prefix','invoicePrefix',s.invoicePrefix)+field('Bank Name','bankName',s.bankName)+field('Account Number','accountNumber',s.accountNumber)+field('IFSC','ifsc',s.ifsc)+field('UPI ID','upi',s.upi)+field('Signature Image','signature','', 'full','file')+'</div></div>'}
function field(label,id,value,cls='',type='text'){return '<div class="field '+cls+'"><label>'+label+'</label><input id="'+id+'" type="'+type+'" value="'+esc(value)+'"></div>'}
function settings(){return title('Settings / About')+'<div class="card"><h2>RentFlow</h2><p class="muted">Rental inventory and billing system.</p><div class="section-title">About</div><p><b>RentFlow</b> • PaliaAPK HUB</p><p class="muted">Developer by shanpalia</p><button class="btn danger" onclick="clearData()">Clear All Local Data</button></div>'}
const pages={dashboard,inventory,customers,issued,returns,register,reports,shop,settings};
function action(a){if(a==='item')openItem();if(a==='customer')openCustomer();if(a==='invoice')openInvoice();if(a==='return')openReturn();if(a==='save-shop')saveShop()}
function modal(html){document.getElementById('modalBox').innerHTML=html;document.getElementById('modal').classList.add('open')}
function closeModal(){document.getElementById('modal').classList.remove('open')}
function openItem(id){const x=data.items.find(a=>a.id===id)||{id:'',name:'',code:'',category:'General',qty:0,rent:''};modal('<div class="modalhead"><h2>'+(id?'Edit Item':'Add Item')+'</h2><button class="close" onclick="closeModal()">×</button></div><div class="form">'+field('Item Name','f_name',x.name)+field('Item Code','f_code',x.code)+field('Category','f_cat',x.category)+field('Current Quantity','f_qty',x.qty)+field('Rent per Day','f_rent',x.rent)+'</div><div style="margin-top:18px;text-align:right"><button class="btn primary" onclick="saveItem(\''+id+'\')">Save Item</button></div>')}
function saveItem(id){const o={id:id||uid(),name:document.getElementById('f_name').value.trim(),code:document.getElementById('f_code').value.trim(),category:document.getElementById('f_cat').value.trim()||'General',qty:Number(document.getElementById('f_qty').value||0),rent:Number(document.getElementById('f_rent').value||0)};if(!o.name){alert('Item name is required');return}const i=data.items.findIndex(x=>x.id===o.id);if(i>=0)data.items[i]=o;else data.items.push(o);persist();closeModal();render()}
function removeItem(id){if(confirm('Delete this item?')){data.items=data.items.filter(x=>x.id!==id);persist();render()}}
function filterItems(){const q=document.getElementById('itemSearch').value.toLowerCase();document.getElementById('itemRows').innerHTML=itemRows(data.items.filter(x=>(x.name+' '+x.code+' '+x.category).toLowerCase().includes(q)))}
function openCustomer(id){const x=data.customers.find(a=>a.id===id)||{id:'',name:'',mobile:'',email:'',address:'',gstin:''};modal('<div class="modalhead"><h2>'+(id?'Edit Party':'Add Party')+'</h2><button class="close" onclick="closeModal()">×</button></div><div class="form">'+field('Party Name','c_name',x.name)+field('Mobile','c_mobile',x.mobile)+field('Email','c_email',x.email)+field('GSTIN','c_gstin',x.gstin)+field('Address','c_address',x.address,'full')+'</div><div style="margin-top:18px;text-align:right"><button class="btn primary" onclick="saveCustomer(\''+id+'\')">Save Party</button></div>')}
function saveCustomer(id){const o={id:id||uid(),name:document.getElementById('c_name').value.trim(),mobile:document.getElementById('c_mobile').value.trim(),email:document.getElementById('c_email').value.trim(),gstin:document.getElementById('c_gstin').value.trim(),address:document.getElementById('c_address').value.trim()};if(!o.name){alert('Party name is required');return}const i=data.customers.findIndex(x=>x.id===o.id);if(i>=0)data.customers[i]=o;else data.customers.push(o);persist();closeModal();render()}
function removeCustomer(id){if(confirm('Delete this party?')){data.customers=data.customers.filter(x=>x.id!==id);persist();render()}}
function openInvoice(){if(!data.customers.length||!data.items.length){alert('First add at least one party and one inventory item.');return}const opts=data.items.map(x=>'<option value="'+x.id+'">'+esc(x.name)+' • Qty '+x.qty+' • '+money(x.rent)+'/day</option>').join('');modal('<div class="modalhead"><h2>New Rental Invoice</h2><button class="close" onclick="closeModal()">×</button></div><div class="form"><div class="field"><label>Party</label><select id="i_customer">'+data.customers.map(x=>'<option value="'+x.id+'">'+esc(x.name)+'</option>').join('')+'</select></div><div class="field"><label>Issue Date</label><input id="i_date" type="date" value="'+today()+'"></div><div class="field"><label>Item</label><select id="i_item">'+opts+'</select></div><div class="field"><label>Quantity</label><input id="i_qty" type="number" min="1" value="1"></div><div class="field"><label>Rent Days</label><input id="i_days" type="number" min="1" value="1"></div></div><div style="margin-top:18px;text-align:right"><button class="btn primary" onclick="saveInvoice()">Save Invoice</button></div>')}
function saveInvoice(){const iid=document.getElementById('i_item').value,q=Number(document.getElementById('i_qty').value||0),days=Number(document.getElementById('i_days').value||0),it=data.items.find(x=>x.id===iid);if(!it||q<1||days<1)return;if(q>Number(it.qty))return alert('Quantity is greater than current stock.');const amount=Number(it.rent)*q*days;data.issues.push({id:uid(),invoice:(data.shop.invoicePrefix||'INV')+'-'+(data.issues.length+1).toString().padStart(4,'0'),date:document.getElementById('i_date').value,customerId:document.getElementById('i_customer').value,amount,items:[{itemId:iid,qty:q,days,rent:Number(it.rent)}]});it.qty-=q;persist();closeModal();go('issued')}
function openReturn(){if(!data.issues.length){alert('No issued invoice is available for return.');return}modal('<div class="modalhead"><h2>Receive Return</h2><button class="close" onclick="closeModal()">×</button></div><div class="form"><div class="field full"><label>Issued Invoice</label><select id="r_issue">'+data.issues.map(x=>'<option value="'+x.id+'">'+esc(x.invoice)+' • '+esc(cname(x.customerId))+'</option>').join('')+'</select></div><div class="field"><label>Return Date</label><input id="r_date" type="date" value="'+today()+'"></div><div class="field"><label>Return Quantity</label><input id="r_qty" type="number" min="1" value="1"></div></div><div style="margin-top:18px;text-align:right"><button class="btn primary" onclick="saveReturn()">Save Return</button></div>')}
function saveReturn(){const issue=data.issues.find(x=>x.id===document.getElementById('r_issue').value);if(!issue)return;const line=issue.items[0],q=Number(document.getElementById('r_qty').value||0),it=data.items.find(x=>x.id===line.itemId);if(!it||q<1||q>line.qty)return alert('Invalid return quantity.');it.qty+=q;const amount=Number(line.rent)*q*Number(line.days);data.returns.push({id:uid(),number:'RET-'+(data.returns.length+1).toString().padStart(4,'0'),date:document.getElementById('r_date').value,customerId:issue.customerId,issueId:issue.id,issueInvoice:issue.invoice,amount,items:[{itemId:line.itemId,qty:q}]});persist();closeModal();go('returns')}
function saveShop(){const s=data.shop;s.name=document.getElementById('shopName').value.trim();s.owner=document.getElementById('owner').value.trim();s.mobile=document.getElementById('mobile').value.trim();s.alternateMobile=document.getElementById('alternateMobile').value.trim();s.email=document.getElementById('email').value.trim();s.businessType=document.getElementById('businessType').value.trim();s.address=document.getElementById('address').value.trim();s.city=document.getElementById('city').value.trim();s.state=document.getElementById('state').value.trim();s.pin=document.getElementById('pin').value.trim();s.gstin=document.getElementById('gstin').value.trim();s.pan=document.getElementById('pan').value.trim();s.invoicePrefix=document.getElementById('invoicePrefix').value.trim()||'INV';s.bankName=document.getElementById('bankName').value.trim();s.accountNumber=document.getElementById('accountNumber').value.trim();s.ifsc=document.getElementById('ifsc').value.trim();s.upi=document.getElementById('upi').value.trim();persist();alert('Company details saved successfully.');render()}
function clearData(){if(confirm('Delete all RentFlow local data?')){localStorage.removeItem(KEY);data=blank();render()}}
document.getElementById('hamb').onclick=()=>{const s=document.querySelector('.side');s.style.display=s.style.display==='block'?'none':'block'};document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')closeModal()};
render();
</script>
</body>
