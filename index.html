<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="favicon.svg" type="image/svg+xml"><meta name="theme-color" content="#008f78"><title>RentFlow • PaliaAPK HUB</title>
<style>
:root{--e:#008f78;--ed:#006b59;--es:#e8f7f3;--bg:#f4f8f7;--ink:#17221f;--muted:#71807c;--line:#d9e5e2;--card:#fff;--danger:#c62828}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px Arial,system-ui,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.top{height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 20px;gap:14px;position:fixed;inset:0 0 auto;z-index:20}.brand{font-size:20px;font-weight:900}.hamb{border:0;background:transparent;font-size:25px}.layout{padding-top:64px;min-height:100vh}.side{position:fixed;top:64px;bottom:0;width:260px;background:#fff;border-right:1px solid var(--line);padding:14px;overflow:auto}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;text-align:left;padding:13px;border-radius:10px;font-weight:800}.nav button:hover,.nav button.active{background:var(--es);color:var(--ed)}.group{font-size:10px;font-weight:900;color:var(--muted);padding:15px 9px 6px}.content{margin-left:260px;min-height:calc(100vh - 64px);padding:24px;width:calc(100% - 260px)}.page{width:100%;min-height:calc(100vh - 112px)}.page-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.page-title h1{margin:0;font-size:28px}.card,.stat,.quick{background:var(--card);border:1px solid var(--line);border-radius:14px}.card{padding:20px;margin-bottom:16px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.stat{padding:18px}.label{color:var(--muted);font-weight:700}.num{font-size:28px;font-weight:900;margin-top:6px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.quick{padding:20px;cursor:pointer}.quick:hover{border-color:var(--e)}.btn{border:0;border-radius:9px;padding:10px 14px;font-weight:800}.primary{background:var(--e);color:#fff}.secondary{background:var(--es);color:var(--ed)}.ghost{background:#fff;border:1px solid var(--line)}.danger{background:#fff0f0;color:var(--danger)}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.search{flex:1}.search input,.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:9px;background:#fff;outline:0}.field label{display:block;font-weight:800;font-size:12px;margin-bottom:6px}.field{margin-bottom:0}.form{display:grid;grid-template-columns:1fr 1fr;gap:14px}.full{grid-column:1/-1}.section{font-size:16px;font-weight:900;border-bottom:1px solid var(--line);padding-bottom:9px;margin:5px 0 14px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{padding:13px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}th{font-size:11px;color:var(--muted);text-transform:uppercase}.pill{background:var(--es);color:var(--ed);padding:5px 9px;border-radius:20px;font-weight:900}.empty{text-align:center;padding:45px;color:var(--muted)}.hero{display:flex;gap:18px;align-items:center}.logo{width:92px;height:92px;border-radius:14px;background:var(--es);display:grid;place-items:center;font-size:35px;overflow:hidden}.logo img{width:100%;height:100%;object-fit:cover}.split{display:grid;grid-template-columns:1.5fr 1fr;gap:16px}.line{display:flex;gap:10px;align-items:center}.right{margin-left:auto}.issue-items{display:grid;gap:10px}.issue-row{display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;gap:10px;align-items:end;padding:12px;background:#f7faf9;border:1px solid var(--line);border-radius:10px}.total{font-size:22px;font-weight:900}.hidden{display:none!important}@media(max-width:1000px){.side{display:none}.content{margin-left:0;width:100%;padding:18px 14px 80px}.stats,.grid4,.split{grid-template-columns:1fr 1fr}.form{grid-template-columns:1fr}.full{grid-column:auto}.issue-row{grid-template-columns:1fr 1fr}.page{min-height:calc(100vh - 100px)}}@media(max-width:600px){.stats,.grid4,.split,.issue-row{grid-template-columns:1fr}.page-title h1{font-size:22px}}
</style></head>
<body>
<header class="top"><div class="brand">RentFlow <span style="color:var(--muted)">• PaliaAPK HUB</span></div></header>
<div class="layout"><aside class="side" id="side"><nav id="nav" class="nav"></nav><div style="color:var(--muted);font-size:12px;margin:20px 8px">By PaliaAPK HUB<br>Developer by shanpalia</div></aside><main class="content"><div id="app" class="page"></div></main></div>
<script>
const KEY='rentflow_web_v6';const menu=[['dashboard','⌂','Dashboard'],['inventory','▦','Inventory / Items'],['customers','♙','Customers / Parties'],['issued','↗','Issued / New Invoice'],['returns','↩','Returns / Receive'],['register','▤','Inventory Register'],['reports','▧','Reports / Bills'],['shop','⌂','Shop / Company'],['settings','⚙','Settings / About']];
const groups=[['MAIN',['dashboard']],['MASTERS',['inventory','customers']],['TRANSACTIONS',['issued','returns']],['REPORTS',['register','reports']],['SYSTEM',['shop','settings']]];
const fresh=()=>({shop:{name:'',owner:'',mobile:'',alternateMobile:'',email:'',address:'',city:'',state:'',pin:'',gstin:'',pan:'',businessType:'',invoicePrefix:'INV',logo:''},items:[],customers:[],issues:[],returns:[],settings:{currency:'₹'}});
let data=load(),current='dashboard';function load(){try{let x=JSON.parse(localStorage.getItem(KEY));if(x){let f=fresh();return {...f,...x,shop:{...f.shop,...(x.shop||{})},settings:{...f.settings,...(x.settings||{})}}}}catch(e){}return fresh()}function save(){localStorage.setItem(KEY,JSON.stringify(data))}function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function money(v){return (data.settings.currency||'₹')+Number(v||0).toFixed(2)}function go(p){if(p==='issued'){location.href='issued.html';return}current=menu.some(x=>x[0]===p)?p:'dashboard';render()}function nav(){let h='';groups.forEach(g=>{h+='<div class="group">'+g[0]+'</div>';g[1].forEach(k=>{let m=menu.find(x=>x[0]===k);h+=`<button class="${current===k?'active':''}" onclick="go('${k}')">${m[1]} &nbsp; ${m[2]}</button>`})});document.getElementById('nav').innerHTML=h}function render(){nav();document.getElementById('app').innerHTML=pages[current]();bind()}function bind(){document.querySelectorAll('[data-go]').forEach(x=>x.onclick=()=>go(x.dataset.go))}
const head=(t,b='')=>`<div class="page-title"><h1>${t}</h1>${b}</div>`;
function dashboard(){let q=data.items.reduce((n,x)=>n+Number(x.qty||0),0);return head('Dashboard',`<button class="btn primary" data-go="issued">＋ New Invoice</button>`)+`<div class="card hero"><div class="logo">${data.shop.logo?`<img src="${data.shop.logo}">`:'🏪'}</div><div><h2 style="margin:0 0 5px">${esc(data.shop.name||'Your Shop')}</h2><div>${esc(data.shop.owner||'Shop Owner')} ${data.shop.mobile?'• '+esc(data.shop.mobile):''}</div><small style="color:var(--muted)">${esc(data.shop.address||'Complete company profile in Shop / Company')}</small></div><button class="btn secondary right" data-go="shop">Company</button></div><div class="stats"><div class="stat"><div class="label">Items</div><div class="num">${data.items.length}</div></div><div class="stat"><div class="label">Current Quantity</div><div class="num">${q}</div></div><div class="stat"><div class="label">Parties</div><div class="num">${data.customers.length}</div></div><div class="stat"><div class="label">Invoices</div><div class="num">${data.issues.length}</div></div></div><div class="card"><h2>Quick Actions</h2><div class="grid4"><div class="quick" data-go="issued">🧾<br><b>New Invoice</b></div><div class="quick" data-go="returns">↩<br><b>Receive Return</b></div><div class="quick" data-go="inventory">＋<br><b>Add Item</b></div><div class="quick" data-go="customers">👤<br><b>Add Party</b></div></div></div>`}
function inventory(){return head('Inventory / Items',`<button class="btn primary" onclick="openItem()">＋ Add Item</button>`)+`<div class="card"><div class="toolbar"><div class="search"><input id="isearch" placeholder="Search item, code, category" oninput="filterItems()"></div></div><div class="tablewrap"><table><thead><tr><th>Item</th><th>Code</th><th>Category</th><th>Current Qty</th><th>Rent / Day</th><th>Actions</th></tr></thead><tbody id="itembody">${itemRows(data.items)}</tbody></table></div></div>`}
function itemRows(a){return a.length?a.map(x=>`<tr><td><b>${esc(x.name)}</b></td><td>${esc(x.code)}</td><td>${esc(x.category||'General')}</td><td><span class="pill">${Number(x.qty||0)}</span></td><td>${money(x.rent)}</td><td><button class="btn ghost" onclick="openItem('${x.id}')">Edit</button> <button class="btn danger" onclick="delItem('${x.id}')">Delete</button></td></tr>`).join(''):`<tr><td colspan="6" class="empty">No items. Click Add Item.</td></tr>`}function filterItems(){let s=(document.getElementById('isearch')?.value||'').toLowerCase();document.getElementById('itembody').innerHTML=itemRows(data.items.filter(x=>[x.name,x.code,x.category].join(' ').toLowerCase().includes(s)))}
function customers(){return head('Customers / Parties',`<button class="btn primary" onclick="openCustomer()">＋ Add Party</button>`)+`<div class="card tablewrap"><table><thead><tr><th>Name</th><th>Mobile</th><th>Email</th><th>Address</th><th>Actions</th></tr></thead><tbody>${data.customers.length?data.customers.map(x=>`<tr><td><b>${esc(x.name)}</b></td><td>${esc(x.mobile)}</td><td>${esc(x.email)}</td><td>${esc(x.address)}</td><td><button class="btn ghost" onclick="openCustomer('${x.id}')">Edit</button></td></tr>`).join(''):`<tr><td colspan="5" class="empty">No parties.</td></tr>`}</tbody></table></div>`}
function issued(){return head('Issued / New Invoice',`<button class="btn ghost" onclick="go('reports')">Reports</button>`)+`<div class="card"><div class="form"><div class="field"><label>Customer / Party</label><select id="icustomer"><option value="">Select party</option>${data.customers.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></div><div class="field"><label>Issue Date</label><input id="idate" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="field full"><label>Invoice Note</label><input id="inote" placeholder="Optional note"></div></div><div class="section" style="margin-top:22px">Inventory — select item, rent quantity and rent days</div><div id="issueItems" class="issue-items"></div><button class="btn secondary" onclick="addIssueRow()">＋ Add Inventory Item</button><div class="line" style="margin-top:18px"><span class="total right" id="itotal">Total ${money(0)}</span><button class="btn primary" onclick="saveIssue()">Save Invoice / Issue</button></div></div>`}
function addIssueRow(){let box=document.getElementById('issueItems');let row=document.createElement('div');row.className='issue-row';row.innerHTML=`<div class="field"><label>Inventory Item</label><select class="ritem"><option value="">Select item</option>${data.items.map(x=>`<option value="${x.id}">${esc(x.name)} — Stock ${x.qty}</option>`).join('')}</select></div><div class="field"><label>Rent Qty</label><input class="rqty" type="number" min="1" value="1"></div><div class="field"><label>Rent Days</label><input class="rdays" type="number" min="1" value="1"></div><div class="field"><label>Rent / Day</label><input class="rrent" type="number" step="0.01" value="0" readonly></div><button class="btn danger" onclick="this.parentElement.remove();calcIssue()">×</button>`;box.appendChild(row);row.querySelector('.ritem').onchange=()=>{let x=data.items.find(a=>a.id===row.querySelector('.ritem').value);row.querySelector('.rrent').value=x?x.rent:0;calcIssue()};row.querySelector('.rqty').oninput=calcIssue;row.querySelector('.rdays').oninput=calcIssue;calcIssue()}
function calcIssue(){let total=0;document.querySelectorAll('.issue-row').forEach(r=>total+=(Number(r.querySelector('.rrent').value)||0)*(Number(r.querySelector('.rqty').value)||0)*(Number(r.querySelector('.rdays').value)||0));let t=document.getElementById('itotal');if(t)t.textContent='Total '+money(total)}
function saveIssue(){let customer=document.getElementById('icustomer').value,rows=[...document.querySelectorAll('.issue-row')];if(!customer||!rows.length)return alert('Select customer and add inventory items.');let items=[];for(let r of rows){let iid=r.querySelector('.ritem').value,q=Number(r.querySelector('.rqty').value),days=Number(r.querySelector('.rdays').value),x=data.items.find(a=>a.id===iid);if(!x||q<1||days<1||q>x.qty)return alert('Check item and rent quantity against current stock.');items.push({itemId:iid,name:x.name,qty:q,rent:x.rent,days,amount:x.rent*q*days});x.qty-=q}let amount=items.reduce((n,x)=>n+x.amount,0);data.issues.push({id:id(),invoice:(data.shop.invoicePrefix||'INV')+'-'+String(data.issues.length+1).padStart(4,'0'),customerId:customer,date:document.getElementById('idate').value,note:document.getElementById('inote').value,items,amount});save();alert('Invoice saved successfully.');go('issued')}
function returns(){return head('Returns / Receive')+`<div class="card"><div class="section">Issued inventory</div>${data.issues.length?data.issues.map(x=>`<div class="line" style="padding:12px 0;border-bottom:1px solid var(--line)"><div><b>${esc(x.invoice)}</b><br><small>${esc((data.customers.find(c=>c.id===x.customerId)||{}).name||'')}</small></div><span class="right">${money(x.amount)}</span><button class="btn secondary" onclick="receive('${x.id}')">Receive</button></div>`).join(''):`<div class="empty">No issued invoices.</div>`}</div>`}
function receive(iid){let x=data.issues.find(a=>a.id===iid);if(!x)return;for(let it of x.items){let inv=data.items.find(a=>a.id===it.itemId);if(inv)inv.qty+=Number(it.qty)}data.returns.push({id:id(),issueId:iid,date:new Date().toISOString().slice(0,10)});data.issues=data.issues.filter(a=>a.id!==iid);save();render();alert('Items received back into inventory.')}
function register(){return head('Inventory Register')+`<div class="card tablewrap"><table><thead><tr><th>Item</th><th>Code</th><th>Current Qty</th><th>Rent / Day</th></tr></thead><tbody>${data.items.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.code)}</td><td><b>${x.qty}</b></td><td>${money(x.rent)}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">No inventory.</td></tr>'}</tbody></table></div>`}
function reports(){return head('Reports / Bills')+`<div class="card tablewrap"><table><thead><tr><th>Invoice</th><th>Party</th><th>Date</th><th>Items</th><th>Amount</th></tr></thead><tbody>${data.issues.map(x=>`<tr><td><b>${esc(x.invoice)}</b></td><td>${esc((data.customers.find(c=>c.id===x.customerId)||{}).name||'')}</td><td>${x.date}</td><td>${x.items.length}</td><td>${money(x.amount)}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">No bills.</td></tr>'}</tbody></table></div>`}
function shop(){let s=data.shop;return head('Shop / Company',`<button class="btn primary" onclick="saveShop()">Save Company</button>`)+`<div class="card"><div class="section">Company / Shop Details</div><div class="form"><div class="field"><label>Shop / Company Name *</label><input id="sn" value="${esc(s.name)}"></div><div class="field"><label>Owner / Contact Person</label><input id="so" value="${esc(s.owner)}"></div><div class="field"><label>Mobile</label><input id="sm" value="${esc(s.mobile)}"></div><div class="field"><label>Alternate Mobile</label><input id="sam" value="${esc(s.alternateMobile)}"></div><div class="field"><label>Email</label><input id="se" value="${esc(s.email)}"></div><div class="field"><label>Business Type</label><input id="sbt" value="${esc(s.businessType)}"></div><div class="field full"><label>Address</label><textarea id="sa">${esc(s.address)}</textarea></div><div class="field"><label>City</label><input id="sc" value="${esc(s.city)}"></div><div class="field"><label>State</label><input id="ss" value="${esc(s.state)}"></div><div class="field"><label>PIN</label><input id="sp" value="${esc(s.pin)}"></div><div class="field"><label>GSTIN</label><input id="sg" value="${esc(s.gstin)}"></div><div class="field"><label>PAN</label><input id="span" value="${esc(s.pan)}"></div><div class="field"><label>Invoice Prefix</label><input id="sip" value="${esc(s.invoicePrefix)}"></div><div class="field full"><label>Company Logo</label><input id="slogo" type="file" accept="image/png,image/jpeg,image/webp"></div></div></div>`}
function saveShop(){let s=data.shop;[['name','sn'],['owner','so'],['mobile','sm'],['alternateMobile','sam'],['email','se'],['businessType','sbt'],['address','sa'],['city','sc'],['state','ss'],['pin','sp'],['gstin','sg'],['pan','span'],['invoicePrefix','sip']].forEach(([a,b])=>s[a]=document.getElementById(b).value.trim());let f=document.getElementById('slogo').files[0];if(f){let r=new FileReader();r.onload=()=>{s.logo=r.result;save();go('shop');alert('Company saved.');};r.readAsDataURL(f)}else{save();alert('Company saved.');render()}}
function settings(){return head('Settings / About')+`<div class="card"><div class="section">Application</div><div class="form"><div class="field"><label>Currency</label><select id="currency"><option ${data.settings.currency==='₹'?'selected':''}>₹</option><option ${data.settings.currency==='$'?'selected':''}>$</option><option ${data.settings.currency==='€'?'selected':''}>€</option></select></div></div><br><button class="btn primary" onclick="data.settings.currency=document.getElementById('currency').value;save();render()">Save Settings</button></div><div class="card"><b>RentFlow • PaliaAPK HUB</b><br><span style="color:var(--muted)">Developer by shanpalia</span></div>`}
function openItem(iid=''){let x=data.items.find(a=>a.id===iid)||{id:'',name:'',code:'',category:'General',qty:0,rent:15};document.getElementById('app').innerHTML=head(iid?'Edit Item':'Add Item',`<button class="btn ghost" onclick="go('inventory')">← Inventory</button>`)+`<div class="card"><div class="form"><div class="field"><label>Item Name *</label><input id="in" value="${esc(x.name)}"></div><div class="field"><label>Item Code</label><input id="ic" value="${esc(x.code)}"></div><div class="field"><label>Category</label><input id="icat" value="${esc(x.category)}"></div><div class="field"><label>Current Quantity *</label><input id="iq" type="number" min="0" value="${x.qty}"></div><div class="field"><label>Rent Price / Day *</label><input id="ir" type="number" min="0" step="0.01" value="${x.rent}"></div></div><p style="color:var(--muted)">No opening quantity field. Current quantity is the live stock. In Issued / New Invoice, choose Rent Qty and Rent Days.</p><button class="btn primary" onclick="saveItem('${iid}')">Save Item</button></div>`}
function saveItem(iid){let x=data.items.find(a=>a.id===iid);if(!x){x={id:id()};data.items.push(x)}x.name=document.getElementById('in').value.trim();x.code=document.getElementById('ic').value.trim();x.category=document.getElementById('icat').value.trim()||'General';x.qty=Number(document.getElementById('iq').value)||0;x.rent=Number(document.getElementById('ir').value)||0;if(!x.name)return alert('Item name is required.');save();go('inventory')}
function delItem(iid){if(confirm('Delete this item?')){data.items=data.items.filter(x=>x.id!==iid);save();render()}}
function openCustomer(cid=''){let x=data.customers.find(a=>a.id===cid)||{id:'',name:'',mobile:'',email:'',address:''};document.getElementById('app').innerHTML=head(cid?'Edit Party':'Add Party',`<button class="btn ghost" onclick="go('customers')">← Parties</button>`)+`<div class="card"><div class="form"><div class="field"><label>Name *</label><input id="cn" value="${esc(x.name)}"></div><div class="field"><label>Mobile</label><input id="cm" value="${esc(x.mobile)}"></div><div class="field"><label>Email</label><input id="ce" value="${esc(x.email)}"></div><div class="field full"><label>Address</label><textarea id="ca">${esc(x.address)}</textarea></div></div><button class="btn primary" onclick="saveCustomer('${cid}')">Save Party</button></div>`}
function saveCustomer(cid){let x=data.customers.find(a=>a.id===cid);if(!x){x={id:id()};data.customers.push(x)}x.name=document.getElementById('cn').value.trim();x.mobile=document.getElementById('cm').value.trim();x.email=document.getElementById('ce').value.trim();x.address=document.getElementById('ca').value.trim();if(!x.name)return alert('Party name is required.');save();go('customers')}
const pages={dashboard:dashboard,inventory:inventory,customers:customers,issued:issued,returns:returns,register:register,reports:reports,shop:shop,settings:settings};
function selectSavedCompany(){current='dashboard';render()}
function companyGate(){
  const saved=data.shop&&data.shop.name;
  if(saved){
    document.getElementById('app').innerHTML=`<div style="min-height:calc(100vh - 112px);display:grid;place-items:center"><div class="card" style="width:min(760px,100%);text-align:center;padding:38px"><div style="font-size:52px">🏪</div><h1>Select Company</h1><p style="color:var(--muted)">Choose the company you want to open in RentFlow.</p><div class="card" style="text-align:left;display:flex;align-items:center;gap:16px"><div class="logo">${data.shop.logo?`<img src="${data.shop.logo}">`:'🏪'}</div><div style="flex:1"><h2 style="margin:0">${esc(data.shop.name)}</h2><div>${esc(data.shop.owner||'')}</div><small style="color:var(--muted)">${esc(data.shop.mobile||data.shop.address||'')}</small></div><button class="btn primary" onclick="selectSavedCompany()">Open Company</button></div><button class="btn secondary" onclick="newCompany()">＋ Create New Company</button></div></div>`;
  }else openCompany();
}
function openCompany(){
  document.getElementById('app').innerHTML=`<div style="min-height:calc(100vh - 112px);display:grid;place-items:center"><div class="card" style="width:min(900px,100%)"><div class="page-title"><h1>Create Company</h1></div><p style="color:var(--muted)">Create your shop/company first. After saving, RentFlow will open the homepage.</p><div class="form"><div class="field"><label>Shop / Company Name *</label><input id="gname"></div><div class="field"><label>Owner / Contact Person</label><input id="gowner"></div><div class="field"><label>Mobile</label><input id="gmob"></div><div class="field"><label>Alternate Mobile</label><input id="galt"></div><div class="field"><label>Email</label><input id="gmail"></div><div class="field"><label>Business Type</label><input id="gbiz"></div><div class="field full"><label>Address</label><textarea id="gaddr"></textarea></div><div class="field"><label>City</label><input id="gcity"></div><div class="field"><label>State</label><input id="gstate"></div><div class="field"><label>PIN</label><input id="gpin"></div><div class="field"><label>GSTIN</label><input id="ggst"></div><div class="field"><label>PAN</label><input id="gpan"></div><div class="field"><label>Invoice Prefix</label><input id="gprefix" value="INV"></div><div class="field full"><label>Company Logo</label><input id="glogo" type="file" accept="image/png,image/jpeg,image/webp"></div></div><div style="margin-top:20px"><button class="btn primary" onclick="createCompany()">Save Company & Open Homepage</button></div></div></div>`;
}
function newCompany(){data.shop={name:'',owner:'',mobile:'',alternateMobile:'',email:'',address:'',city:'',state:'',pin:'',gstin:'',pan:'',businessType:'',invoicePrefix:'INV',logo:''};save();openCompany()}
