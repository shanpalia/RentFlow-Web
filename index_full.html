<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#008f78"><link rel="icon" href="favicon.svg" type="image/svg+xml">
<title>RentFlow • PaliaAPK HUB</title>
<style>
:root{--e:#008f78;--ed:#006b59;--es:#e4f6f1;--bg:#f5f8f7;--ink:#15221f;--muted:#71807c;--line:#dbe6e3;--red:#c62828;--amber:#a56a00;--card:#fff;--shadow:0 6px 24px rgba(0,70,55,.07)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px Inter,system-ui,-apple-system,Segoe UI,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.top{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 20px;gap:14px;position:sticky;top:0;z-index:40}.hamb{border:0;background:transparent;font-size:26px}.brand{font-size:19px;font-weight:900}.layout{display:flex;min-height:calc(100vh - 68px)}.side{width:270px;flex:0 0 270px;background:#fff;border-right:1px solid var(--line);padding:16px;position:sticky;top:68px;height:calc(100vh - 68px);overflow:auto}.nav{display:grid;gap:4px}.nav button{border:0;background:transparent;text-align:left;padding:12px;border-radius:12px;font-weight:800;color:var(--ink)}.nav button:hover,.nav button.active{background:var(--es);color:var(--ed)}.nav .group{padding:16px 12px 7px;font-size:11px;color:var(--muted);font-weight:900;text-transform:uppercase;letter-spacing:.06em}.content{flex:1;min-width:0;padding:22px;max-width:1600px}.page-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.page-title h1{margin:0;font-size:27px}.muted{color:var(--muted)}.small{font-size:12px}.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:850}.primary{background:var(--e);color:#fff}.secondary{background:var(--es);color:var(--ed)}.danger{background:#fff0f0;color:var(--red)}.ghost{background:#fff;border:1px solid var(--line)}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow);margin-bottom:16px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.stat{background:#fff;border:1px solid var(--line);border-radius:15px;padding:16px}.stat .n{font-size:28px;font-weight:950;margin-top:5px}.stat .label{color:var(--muted);font-weight:750}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.quick{background:#fff;border:1px solid var(--line);border-radius:15px;padding:18px;cursor:pointer}.quick:hover{border-color:var(--e);box-shadow:var(--shadow)}.ico{font-size:25px;margin-bottom:8px}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.search{min-width:230px;flex:1}.search input,.toolbar select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{padding:12px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}th{font-size:11px;text-transform:uppercase;color:var(--muted);letter-spacing:.04em}tr:hover td{background:#fbfdfc}.pill{display:inline-block;background:var(--es);color:var(--ed);padding:4px 8px;border-radius:99px;font-size:11px;font-weight:900}.low{background:#fff3dc;color:var(--amber)}.empty{padding:50px;text-align:center;color:var(--muted)}.form{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field label{display:block;font-weight:850;font-size:12px;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;outline:0}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--e);box-shadow:0 0 0 3px var(--es)}.full{grid-column:1/-1}.hero{display:flex;align-items:center;gap:16px}.company-logo{width:76px;height:76px;border-radius:16px;background:var(--es);display:grid;place-items:center;overflow:hidden;font-size:34px}.company-logo img{width:100%;height:100%;object-fit:cover}.hero h2{margin:0 0 4px}.split{display:grid;grid-template-columns:1.35fr .65fr;gap:16px}.modal{position:fixed;inset:0;background:#0008;display:none;place-items:center;padding:18px;z-index:100}.modal.open{display:grid}.modalbox{background:#fff;width:min(900px,100%);max-height:94vh;overflow:auto;border-radius:18px;padding:20px}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.modalhead h2{margin:0}.close{border:0;background:#eef2f1;border-radius:9px;padding:7px 11px;font-size:18px}.invoice-lines{display:grid;gap:8px}.line{display:grid;grid-template-columns:2fr 100px 130px 130px 45px;gap:8px;align-items:center}.line select,.line input{width:100%;padding:9px;border:1px solid var(--line);border-radius:9px}.totals{margin-left:auto;width:min(360px,100%)}.totalrow{display:flex;justify-content:space-between;padding:8px 0}.grand{font-size:20px;font-weight:950;border-top:2px solid var(--line);margin-top:5px}.mobile-nav{display:none}@media(max-width:1000px){.side{display:none}.content{padding:16px 14px 90px}.stats,.grid4{grid-template-columns:1fr 1fr}.grid3{grid-template-columns:1fr 1fr}.mobile-nav{display:grid;position:fixed;left:8px;right:8px;bottom:8px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:5px;grid-template-columns:repeat(5,1fr);z-index:50;box-shadow:var(--shadow)}.mobile-nav button{border:0;background:transparent;padding:8px 2px;border-radius:10px;font-size:10px}.mobile-nav button.active{background:var(--es);color:var(--ed);font-weight:900}.split{grid-template-columns:1fr}}@media(max-width:650px){.stats,.grid3,.grid4,.form{grid-template-columns:1fr}.full{grid-column:auto}.page-title{align-items:flex-start}.page-title h1{font-size:22px}.line{grid-template-columns:1fr 85px 100px 90px 40px;min-width:520px}.hero{align-items:flex-start}.brand{font-size:16px}}
</style></head>
<body>
<header class="top"><button class="hamb" id="menuBtn">☰</button><div class="brand">RentFlow <span class="muted">• PaliaAPK HUB</span></div></header>
<div class="layout"><aside class="side" id="side"><nav class="nav" id="nav"></nav><div class="small muted" style="margin:18px 8px">By PaliaAPK HUB<br>Developer by shanpalia</div></aside><main class="content" id="app"></main></div>
<nav class="mobile-nav" id="mobileNav"></nav><div class="modal" id="modal"><div class="modalbox" id="modalBox"></div></div>
<script>
'use strict';
const KEY='rentflow_web_v4';
const PAGES=[['dashboard','⌂','Dashboard'],['inventory','▦','Inventory / Items'],['customers','♙','Customers / Parties'],['issued','↗','Issued / New Invoice'],['returns','↩','Returns / Receive'],['register','▤','Inventory Register'],['reports','▧','Reports / Bills'],['shop','⌂','Shop / Company'],['settings','⚙','Settings / About']];
const GROUPS=[['MAIN',['dashboard']],['MASTERS',['inventory','customers']],['TRANSACTIONS',['issued','returns']],['REPORTS',['register','reports']],['SYSTEM',['shop','settings']]];
let data=read(),current='dashboard';
function blank(){return{shop:{name:'Your Shop',owner:'',mobile:'',address:'',image:''},items:[],customers:[],issues:[],returns:[],settings:{currency:'₹'}}}
function read(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x){const b=blank();return {...b,...x,shop:{...b.shop,...(x.shop||{})},settings:{...b.settings,...(x.settings||{})},items:Array.isArray(x.items)?x.items:[],customers:Array.isArray(x.customers)?x.customers:[],issues:Array.isArray(x.issues)?x.issues:[],returns:Array.isArray(x.returns)?x.returns:[]}}}catch(e){}return blank()}
function save(){localStorage.setItem(KEY,JSON.stringify(data));render(current)}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function money(v){return (data.settings.currency||'₹')+Number(v||0).toFixed(2)}
function today(){return new Date().toISOString().slice(0,10)}
function cname(id){return data.customers.find(x=>x.id===id)?.name||'Unknown party'}
function item(id){return data.items.find(x=>x.id===id)}
function remaining(issueId,itemId){const issue=data.issues.find(x=>x.id===issueId);if(!issue)return 0;const issued=Number(issue.items.find(x=>x.itemId===itemId)?.qty||0);const returned=data.returns.filter(x=>x.issueId===issueId).reduce((n,x)=>n+Number(x.items.find(q=>q.itemId===itemId)?.qty||0),0);return Math.max(0,issued-returned)}
function nav(){let html='';GROUPS.forEach(g=>{html+=`<div class="group">${g[0]}</div>`;g[1].forEach(id=>{const p=PAGES.find(x=>x[0]===id);html+=`<button data-page="${p[0]}" class="${current===p[0]?'active':''}"><span style="display:inline-block;width:28px">${p[1]}</span>${p[2]}</button>`})});document.getElementById('nav').innerHTML=html;document.getElementById('mobileNav').innerHTML=PAGES.slice(0,5).map(p=>`<button data-page="${p[0]}" class="${current===p[0]?'active':''}">${p[1]}<br>${p[2].split(' ')[0]}</button>`).join('');document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page))}
function go(p){current=PAGES.some(x=>x[0]===p)?p:'dashboard';if(innerWidth<1001)document.getElementById('side').style.display='none';render(current);scrollTo(0,0)}
function render(p){nav();document.getElementById('app').innerHTML=pages[p]();bind()}
function bind(){document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>act(b.dataset.action))}
function title(t,b=''){return`<div class="page-title"><h1>${t}</h1>${b}</div>`}
const pages={dashboard,inventory,customers,issued,returns,register,reports,shop,settings};
function dashboard(){const billed=data.issues.reduce((n,x)=>n+Number(x.amount||0),0),stock=data.items.reduce((n,x)=>n+Number(x.qty||0),0);return title('Dashboard',`<button class="btn primary" data-action="new-invoice">＋ New Invoice</button>`)+`<div class="card hero"><div class="company-logo">${data.shop.image?`<img src="${data.shop.image}">`:'🏪'}</div><div style="flex:1"><h2>${esc(data.shop.name)}</h2><div class="muted">${esc(data.shop.owner||'Shop Owner')} ${data.shop.mobile?'• '+esc(data.shop.mobile):''}</div><div class="small muted">${esc(data.shop.address||'Set company details from Shop / Company')}</div></div><button class="btn secondary" data-go="shop">Company Settings</button></div><div class="stats"><div class="stat"><div class="label">Inventory Items</div><div class="n">${data.items.length}</div></div><div class="stat"><div class="label">Current Stock</div><div class="n">${stock}</div></div><div class="stat"><div class="label">Parties</div><div class="n">${data.customers.length}</div></div><div class="stat"><div class="label">Rental Billing</div><div class="n">${money(billed)}</div></div></div><div class="card"><h2 style="margin-top:0">Quick Actions</h2><div class="grid4"><div class="quick" data-action="new-invoice"><div class="ico">🧾</div><b>New Invoice</b><div class="muted small">Issue rental stock</div></div><div class="quick" data-action="new-return"><div class="ico">↩</div><b>Receive Return</b><div class="muted small">Return issued items</div></div><div class="quick" data-action="add-item"><div class="ico">＋</div><b>Add Item</b><div class="muted small">Inventory master</div></div><div class="quick" data-action="add-customer"><div class="ico">👤</div><b>Add Party</b><div class="muted small">Customer master</div></div></div></div><div class="split"><div class="card"><h3>Recent Invoices</h3>${data.issues.slice().reverse().slice(0,6).map(x=>`<div style="display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)"><b>${esc(x.invoice)}</b><span>${esc(cname(x.customerId))}</span><span class="muted" style="margin-left:auto">${money(x.amount)}</span></div>`).join('')||'<div class="empty">No invoices yet.</div>'}</div><div class="card"><h3>Low Stock</h3>${data.items.filter(x=>Number(x.qty)<=5).slice(0,6).map(x=>`<div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)"><span>${esc(x.name)}</span><span class="pill low">${x.qty}</span></div>`).join('')||'<div class="empty">No low-stock items.</div>'}</div></div>`}
function inventory(){return title('Inventory / Items',`<button class="btn primary" data-action="add-item">＋ Add Item</button>`)+`<div class="stats"><div class="stat"><div class="label">Total Items</div><div class="n">${data.items.length}</div></div><div class="stat"><div class="label">Total Quantity</div><div class="n">${data.items.reduce((n,x)=>n+Number(x.qty||0),0)}</div></div><div class="stat"><div class="label">Low Stock ≤ 5</div><div class="n">${data.items.filter(x=>Number(x.qty)<=5).length}</div></div><div class="stat"><div class="label">Categories</div><div class="n">${new Set(data.items.map(x=>x.category||'General')).size}</div></div></div><div class="card"><div class="toolbar"><div class="search"><input id="invSearch" placeholder="Search item, code or category..." oninput="filterInventory()"></div><select id="invCat" onchange="filterInventory()"><option value="">All Categories</option>${[...new Set(data.items.map(x=>x.category||'General'))].sort().map(x=>`<option>${esc(x)}</option>`).join('')}</select><button class="btn ghost" data-action="add-item">+ Add Item</button></div></div><div class="card"><div class="tablewrap"><table><thead><tr><th>Item Code</th><th>Item Name</th><th>Category</th><th>Opening Qty</th><th>Current Qty</th><th>Rent / 100 Days</th><th>Status</th><th>Actions</th></tr></thead><tbody id="inventoryBody">${inventoryRows()}</tbody></table></div></div>`}
function inventoryRows(){if(!data.items.length)return`<tr><td colspan="8" class="empty">No inventory yet. Click Add Item to create your first stock item.</td></tr>`;return data.items.map(i=>`<tr data-item-row data-search="${esc((i.name+' '+i.code+' '+(i.category||'')).toLowerCase())}" data-cat="${esc(i.category||'General')}"><td>${esc(i.code||'—')}</td><td><b>${esc(i.name)}</b></td><td><span class="pill">${esc(i.category||'General')}</span></td><td>${i.openingQty??i.qty}</td><td><b>${i.qty}</b></td><td>${money(i.rent)}</td><td>${Number(i.qty)<=5?'<span class="pill low">Low Stock</span>':'<span class="pill">In Stock</span>'}</td><td><button class="btn secondary" data-action="edit-item:${i.id}">Edit</button> <button class="btn danger" data-action="delete-item:${i.id}">Delete</button></td></tr>`).join('')}
function filterInventory(){const q=(document.getElementById('invSearch')?.value||'').toLowerCase(),c=document.getElementById('invCat')?.value||'';document.querySelectorAll('[data-item-row]').forEach(r=>r.style.display=(!q||r.dataset.search.includes(q))&&(!c||r.dataset.cat===c)?'':'none')}
function customers(){return title('Customers / Parties',`<button class="btn primary" data-action="add-customer">＋ Add Customer</button>`)+`<div class="stats"><div class="stat"><div class="label">Total Parties</div><div class="n">${data.customers.length}</div></div><div class="stat"><div class="label">Invoices</div><div class="n">${data.issues.length}</div></div><div class="stat"><div class="label">Active Returns</div><div class="n">${data.returns.length}</div></div><div class="stat"><div class="label">Company</div><div class="n">${data.shop.name?'✓':'—'}</div></div></div><div class="card"><div class="toolbar"><div class="search"><input placeholder="Search party name, mobile or address..." oninput="filterCustomers(this.value)"></div><button class="btn ghost" data-action="add-customer">+ Add Party</button></div></div><div class="card"><div class="tablewrap"><table><thead><tr><th>Party Name</th><th>Mobile</th><th>Address</th><th>Total Issues</th><th>Total Billed</th><th>Actions</th></tr></thead><tbody>${customerRows()}</tbody></table></div></div>`}
function customerRows(){if(!data.customers.length)return`<tr><td colspan="6" class="empty">No parties yet. Click Add Customer.</td></tr>`;return data.customers.map(c=>{const inv=data.issues.filter(x=>x.customerId===c.id);return`<tr data-customer-row data-search="${esc((c.name+' '+c.mobile+' '+c.address).toLowerCase())}"><td><b>${esc(c.name)}</b></td><td>${esc(c.mobile)}</td><td>${esc(c.address)}</td><td>${inv.length}</td><td>${money(inv.reduce((n,x)=>n+Number(x.amount||0),0))}</td><td><button class="btn secondary" data-action="edit-customer:${c.id}">Edit</button> <button class="btn danger" data-action="delete-customer:${c.id}">Delete</button></td></tr>`}).join('')}
function filterCustomers(q){q=(q||'').toLowerCase();document.querySelectorAll('[data-customer-row]').forEach(r=>r.style.display=!q||r.dataset.search.includes(q)?'':'none')}
function issued(){return title('Issued / New Invoice',`<button class="btn primary" data-action="new-invoice">＋ New Invoice</button>`)+`<div class="stats"><div class="stat"><div class="label">Invoices</div><div class="n">${data.issues.length}</div></div><div class="stat"><div class="label">Total Quantity Issued</div><div class="n">${data.issues.reduce((n,x)=>n+x.items.reduce((a,q)=>a+Number(q.qty),0),0)}</div></div><div class="stat"><div class="label">Total Billing</div><div class="n">${money(data.issues.reduce((n,x)=>n+Number(x.amount||0),0))}</div></div><div class="stat"><div class="label">Today</div><div class="n">${data.issues.filter(x=>x.date===today()).length}</div></div></div><div class="card"><div class="toolbar"><div class="search"><input placeholder="Search invoice or party..." oninput="filterTable(this.value,'issue-row')"></div><input type="date" onchange="filterIssuesDate(this.value)" style="padding:10px;border:1px solid var(--line);border-radius:10px"><button class="btn ghost" data-action="new-invoice">+ New Invoice</button></div></div><div class="card"><div class="tablewrap"><table><thead><tr><th>Invoice No.</th><th>Date</th><th>Customer / Party</th><th>Items</th><th>Qty</th><th>Amount</th><th>Actions</th></tr></thead><tbody>${data.issues.length?data.issues.slice().reverse().map(x=>`<tr class="issue-row" data-search="${esc((x.invoice+' '+cname(x.customerId)).toLowerCase())}" data-date="${x.date}"><td><b>${esc(x.invoice)}</b></td><td>${x.date}</td><td>${esc(cname(x.customerId))}</td><td>${x.items.length}</td><td>${x.items.reduce((n,i)=>n+Number(i.qty),0)}</td><td>${money(x.amount)}</td><td><button class="btn secondary" data-action="print-issue:${x.id}">Print</button></td></tr>`).join(''):`<tr><td colspan="7" class="empty">No issued invoices. Click New Invoice.</td></tr>`}</tbody></table></div></div>`}
function filterTable(q,cls){q=(q||'').toLowerCase();document.querySelectorAll('.'+cls).forEach(r=>r.style.display=!q||r.dataset.search.includes(q)?'':'none')}
function filterIssuesDate(d){document.querySelectorAll('.issue-row').forEach(r=>r.style.display=!d||r.dataset.date===d?'':'none')}
function returns(){return title('Returns / Receive',`<button class="btn primary" data-action="new-return">＋ Receive Return</button>`)+`<div class="stats"><div class="stat"><div class="label">Return Receipts</div><div class="n">${data.returns.length}</div></div><div class="stat"><div class="label">Items Returned</div><div class="n">${data.returns.reduce((n,x)=>n+x.items.reduce((a,q)=>a+Number(q.qty),0),0)}</div></div><div class="stat"><div class="label">Return Amount</div><div class="n">${money(data.returns.reduce((n,x)=>n+Number(x.amount||0),0))}</div></div><div class="stat"><div class="label">Today</div><div class="n">${data.returns.filter(x=>x.date===today()).length}</div></div></div><div class="card"><div class="toolbar"><div class="search"><input placeholder="Search return, invoice or party..." oninput="filterTable(this.value,'return-row')"></div><button class="btn ghost" data-action="new-return">+ Receive Return</button></div></div><div class="card"><div class="tablewrap"><table><thead><tr><th>Return No.</th><th>Invoice</th><th>Date</th><th>Customer</th><th>Qty</th><th>Amount</th></tr></thead><tbody>${data.returns.length?data.returns.slice().reverse().map(x=>`<tr class="return-row" data-search="${esc((x.number+' '+x.invoice+' '+cname(x.customerId)).toLowerCase())}"><td><b>${esc(x.number)}</b></td><td>${esc(x.invoice)}</td><td>${x.date}</td><td>${esc(cname(x.customerId))}</td><td>${x.items.reduce((n,i)=>n+Number(i.qty),0)}</td><td>${money(x.amount)}</td></tr>`).join(''):`<tr><td colspan="6" class="empty">No returns recorded.</td></tr>`}</tbody></table></div></div>`}
function register(){return title('Inventory Register',`<button class="btn secondary" data-action="print-report">Print Register</button>`)+`<div class="card"><div class="toolbar"><div class="search"><input placeholder="Search inventory..." oninput="filterTable(this.value,'reg-row')"></div></div></div><div class="card"><div class="tablewrap"><table><thead><tr><th>Item</th><th>Code</th><th>Opening Qty</th><th>Current Qty</th><th>Total Issued</th><th>Total Returned</th><th>Balance Movement</th></tr></thead><tbody>${data.items.length?data.items.map(i=>{let is=0,re=0;data.issues.forEach(x=>x.items.forEach(q=>{if(q.itemId===i.id)is+=Number(q.qty)}));data.returns.forEach(x=>x.items.forEach(q=>{if(q.itemId===i.id)re+=Number(q.qty)}));return`<tr class="reg-row" data-search="${esc((i.name+' '+i.code).toLowerCase())}"><td><b>${esc(i.name)}</b></td><td>${esc(i.code)}</td><td>${i.openingQty??i.qty}</td><td><b>${i.qty}</b></td><td>${is}</td><td>${re}</td><td>${is-re}</td></tr>`}).join(''):`<tr><td colspan="7" class="empty">No inventory records.</td></tr>`}</tbody></table></div></div>`}
function reports(){const bill=data.issues.reduce((n,x)=>n+Number(x.amount||0),0),ret=data.returns.reduce((n,x)=>n+Number(x.amount||0),0);return title('Reports / Bills',`<button class="btn primary" data-action="print-report">Print Report</button>`)+`<div class="stats"><div class="stat"><div class="label">Gross Billing</div><div class="n">${money(bill)}</div></div><div class="stat"><div class="label">Returns</div><div class="n">${money(ret)}</div></div><div class="stat"><div class="label">Net Billing</div><div class="n">${money(bill-ret)}</div></div><div class="stat"><div class="label">Invoices</div><div class="n">${data.issues.length}</div></div></div><div class="card"><h2 style="margin-top:0">Recent Bills</h2><div class="tablewrap"><table><thead><tr><th>Invoice</th><th>Date</th><th>Party</th><th>Amount</th><th>Action</th></tr></thead><tbody>${data.issues.length?data.issues.slice().reverse().slice(0,20).map(x=>`<tr><td><b>${esc(x.invoice)}</b></td><td>${x.date}</td><td>${esc(cname(x.customerId))}</td><td>${money(x.amount)}</td><td><button class="btn secondary" data-action="print-issue:${x.id}">Print</button></td></tr>`).join(''):`<tr><td colspan="5" class="empty">No bills available.</td></tr>`}</tbody></table></div></div>`}
function shop(){return title('Shop / Company',`<button class="btn primary" data-action="save-shop">Save Company</button>`)+`<div class="card"><div class="hero"><div class="company-logo">${data.shop.image?`<img src="${data.shop.image}">`:'🏪'}</div><div><h2>Company Profile</h2><div class="muted">This company identity is used on the dashboard and printouts.</div></div></div></div><div class="card"><div class="form"><div class="field"><label>Shop / Company Name *</label><input id="shopName" value="${esc(data.shop.name)}"></div><div class="field"><label>Owner Name</label><input id="shopOwner" value="${esc(data.shop.owner)}"></div><div class="field"><label>Mobile</label><input id="shopMobile" value="${esc(data.shop.mobile)}"></div><div class="field"><label>Currency</label><input id="shopCurrency" value="${esc(data.settings.currency||'₹')}"></div><div class="field full"><label>Address</label><textarea id="shopAddress" rows="4">${esc(data.shop.address)}</textarea></div><div class="field full"><label>Company Logo / Image</label><input id="shopImage" type="file" accept="image/png,image/jpeg,image/webp,image/svg+xml"><div class="small muted">PNG/JPG/WEBP/SVG, maximum 2 MB.</div></div><div class="full toolbar"><button class="btn primary" data-action="save-shop">Save Company Details</button><button class="btn secondary" data-action="remove-shop-image">Remove Image</button></div></div></div><div class="card"><h3>Company Preview</h3><div class="hero"><div class="company-logo">${data.shop.image?`<img src="${data.shop.image}">`:'🏪'}</div><div><b>${esc(data.shop.name)}</b><div>${esc(data.shop.owner)}</div><div>${esc(data.shop.mobile)}</div><div class="muted">${esc(data.shop.address)}</div></div></div></div>`}
function settings(){return title('Settings / About')+`<div class="grid3"><div class="card"><h3>Data Storage</h3><p class="muted">RentFlow stores records locally in this browser. No demo records are inserted.</p></div><div class="card"><h3>Currency</h3><p class="muted">Current currency: <b>${esc(data.settings.currency||'₹')}</b></p></div><div class="card"><h3>Branding</h3><p class="muted">RentFlow • By PaliaAPK HUB • Developer by shanpalia</p></div></div><div class="card"><h3>Danger Zone</h3><p class="muted">This removes all locally stored RentFlow records from this browser.</p><button class="btn danger" data-action="clear-data">Clear All Local Data</button></div>`}
function openModal(html){document.getElementById('modalBox').innerHTML=html;document.getElementById('modal').classList.add('open');bind()}
function closeModal(){document.getElementById('modal').classList.remove('open')}
function itemForm(id){const old=item(id)||{name:'',code:'',category:'General',qty:0,openingQty:0,rent:15};openModal(`<div class="modalhead"><h2>${id?'Edit':'Add'} Inventory Item</h2><button class="close" data-action="close">×</button></div><div class="form"><div class="field"><label>Item Name *</label><input id="fName" value="${esc(old.name)}"></div><div class="field"><label>Item Code</label><input id="fCode" value="${esc(old.code)}"></div><div class="field"><label>Category</label><input id="fCat" value="${esc(old.category||'General')}"></div><div class="field"><label>Opening Quantity *</label><input id="fQty" type="number" min="0" value="${old.openingQty??old.qty}"></div><div class="field"><label>Rent per 100 Days</label><input id="fRent" type="number" min="0" step="0.01" value="${old.rent??15}"></div><div class="field"><label>Current Quantity</label><input id="fCurrent" type="number" min="0" value="${old.qty??0}"></div><div class="full toolbar"><button class="btn primary" data-action="save-item:${id||''}">Save Item</button><button class="btn ghost" data-action="close">Cancel</button></div></div>`)}
function customerForm(id){const old=data.customers.find(x=>x.id===id)||{name:'',mobile:'',address:'',notes:''};openModal(`<div class="modalhead"><h2>${id?'Edit':'Add'} Customer / Party</h2><button class="close" data-action="close">×</button></div><div class="form"><div class="field"><label>Party Name *</label><input id="cName" value="${esc(old.name)}"></div><div class="field"><label>Mobile</label><input id="cMobile" value="${esc(old.mobile)}"></div><div class="field full"><label>Address</label><textarea id="cAddress" rows="3">${esc(old.address)}</textarea></div><div class="field full"><label>Notes</label><textarea id="cNotes" rows="3">${esc(old.notes)}</textarea></div><div class="full"><button class="btn primary" data-action="save-customer:${id||''}">Save Customer</button></div></div>`)}
function invoiceForm(){if(!data.customers.length)return alert('Please add a customer / party first.');if(!data.items.length)return alert('Please add inventory items first.');openModal(`<div class="modalhead"><h2>New Rental Invoice</h2><button class="close" data-action="close">×</button></div><div class="form"><div class="field"><label>Customer / Party *</label><select id="iCustomer">${data.customers.map(x=>`<option value="${x.id}">${esc(x.name)}${x.mobile?' • '+esc(x.mobile):''}</option>`).join('')}</select></div><div class="field"><label>Issue Date</label><input id="iDate" type="date" value="${today()}"></div><div class="field"><label>Notes</label><input id="iNotes"></div></div><h3>Rental Items</h3><div id="invoiceLines" class="invoice-lines">${invoiceLine()}</div><div class="toolbar" style="margin:12px 0"><button class="btn secondary" data-action="add-invoice-line">＋ Add Item Line</button></div><div class="totals"><div class="totalrow"><span>Subtotal</span><b id="invTotal">₹0.00</b></div><div class="totalrow grand"><span>Total</span><b id="invGrand">₹0.00</b></div></div><div class="toolbar" style="justify-content:flex-end;margin-top:18px"><button class="btn ghost" data-action="close">Cancel</button><button class="btn primary" data-action="save-invoice">Save & Print</button></div>`);calcInvoice()}
function invoiceLine(){return`<div class="line"><select class="inv-item" onchange="calcInvoice()"><option value="">Select item</option>${data.items.map(x=>`<option value="${x.id}">${esc(x.name)} • Stock ${x.qty}</option>`).join('')}</select><input class="inv-qty" type="number" min="1" value="1" oninput="calcInvoice()"><input class="inv-days" type="number" min="1" value="1" oninput="calcInvoice()"><input class="inv-rent" type="number" min="0" step="0.01" value="0" oninput="calcInvoice()"><button class="btn danger" data-action="remove-invoice-line">×</button></div>`}
function calcInvoice(){let total=0;document.querySelectorAll('.line').forEach(r=>{const id=r.querySelector('.inv-item')?.value,i=item(id);if(i){r.querySelector('.inv-rent').value=i.rent??15;total+=Number(r.querySelector('.inv-qty').value||0)*Number(r.querySelector('.inv-days').value||0)*Number(r.querySelector('.inv-rent').value||0)/100}});const a=document.getElementById('invTotal');if(a)a.textContent=money(total);const g=document.getElementById('invGrand');if(g)g.textContent=money(total)}
function returnForm(){if(!data.issues.length)return alert('No issued invoice is available for return.');openModal(`<div class="modalhead"><h2>Receive Rental Return</h2><button class="close" data-action="close">×</button></div><div class="form"><div class="field full"><label>Issued Invoice *</label><select id="rIssue" onchange="renderReturnLines()"><option value="">Select invoice</option>${data.issues.slice().reverse().map(x=>`<option value="${x.id}">${esc(x.invoice)} • ${esc(cname(x.customerId))} • ${x.date}</option>`).join('')}</select></div></div><div id="returnLines" class="card" style="margin-top:14px"><div class="empty">Select an invoice.</div></div><div class="toolbar" style="justify-content:flex-end"><button class="btn ghost" data-action="close">Cancel</button><button class="btn primary" data-action="save-return">Save Return</button></div>`)}
function renderReturnLines(){const id=document.getElementById('rIssue').value,box=document.getElementById('returnLines');if(!id){box.innerHTML='<div class="empty">Select an invoice.</div>';return}const x=data.issues.find(q=>q.id===id);box.innerHTML=`<div class="tablewrap"><table><thead><tr><th>Item</th><th>Issued</th><th>Already Returned</th><th>Remaining</th><th>Return Qty</th></tr></thead><tbody>${x.items.map(q=>{const rem=remaining(id,q.itemId);return`<tr><td><b>${esc(item(q.itemId)?.name||'Unknown')}</b></td><td>${q.qty}</td><td>${Number(q.qty)-rem}</td><td>${rem}</td><td><input class="return-qty" data-item="${q.itemId}" type="number" min="0" max="${rem}" value="0" style="width:100px;padding:8px;border:1px solid var(--line);border-radius:8px"></td></tr>`}).join('')}</tbody></table></div>`}
function act(a){if(a==='close')return closeModal();if(a==='add-item')return itemForm();if(a.startsWith('edit-item:'))return itemForm(a.split(':')[1]);if(a.startsWith('delete-item:')){if(confirm('Delete this item?')){data.items=data.items.filter(x=>x.id!==a.split(':')[1]);save()}return}if(a==='add-customer')return customerForm();if(a.startsWith('edit-customer:'))return customerForm(a.split(':')[1]);if(a.startsWith('delete-customer:')){if(confirm('Delete this party?')){data.customers=data.customers.filter(x=>x.id!==a.split(':')[1]);save()}return}if(a==='new-invoice')return invoiceForm();if(a==='add-invoice-line'){document.getElementById('invoiceLines').insertAdjacentHTML('beforeend',invoiceLine());bind();return calcInvoice()}if(a==='remove-invoice-line'){const t=event?.target?.closest('.line');if(document.querySelectorAll('.line').length>1&&t)t.remove();return calcInvoice()}if(a==='save-invoice')return saveInvoice();if(a==='new-return')return returnForm();if(a==='save-return')return saveReturn();if(a==='save-shop')return saveShop();if(a==='remove-shop-image'){data.shop.image='';save();return}if(a==='clear-data'){if(confirm('Clear all RentFlow data from this browser?')){localStorage.removeItem(KEY);data=blank();save()}return}if(a.startsWith('print-issue:'))return printIssue(a.split(':')[1]);if(a==='print-report')return printReport()}
function saveItem(id){const name=document.getElementById('fName').value.trim();if(!name)return alert('Item name is required.');const old=item(id);const x={id:id||uid(),name,code:document.getElementById('fCode').value.trim(),category:document.getElementById('fCat').value.trim()||'General',openingQty:Number(document.getElementById('fQty').value||0),qty:Number(document.getElementById('fCurrent').value||0),rent:Number(document.getElementById('fRent').value||0)};if(old)Object.assign(old,x);else data.items.push(x);closeModal();save();go('inventory')}
function saveCustomer(id){const name=document.getElementById('cName').value.trim();if(!name)return alert('Party name is required.');const x={id:id||uid(),name,mobile:document.getElementById('cMobile').value.trim(),address:document.getElementById('cAddress').value.trim(),notes:document.getElementById('cNotes').value.trim()};const old=data.customers.find(q=>q.id===id);if(old)Object.assign(old,x);else data.customers.push(x);closeModal();save();go('customers')}
function saveInvoice(){const customerId=document.getElementById('iCustomer').value,items=[];document.querySelectorAll('.line').forEach(r=>{const itemId=r.querySelector('.inv-item').value,qty=Number(r.querySelector('.inv-qty').value||0),days=Number(r.querySelector('.inv-days').value||0),rent=Number(r.querySelector('.inv-rent').value||0);if(itemId&&qty>0&&days>0)items.push({itemId,qty,days,rent,amount:qty*days*rent/100})});if(!items.length)return alert('Add at least one item.');for(const q of items){const it=item(q.itemId);if(!it||q.qty>Number(it.qty))return alert('Insufficient stock for '+(it?.name||'item'));}items.forEach(q=>item(q.itemId).qty-=q.qty);const amount=items.reduce((n,q)=>n+q.amount,0);const x={id:uid(),invoice:'INV-'+Date.now().toString().slice(-8),customerId,date:document.getElementById('iDate').value||today(),notes:document.getElementById('iNotes').value.trim(),items,amount};data.issues.push(x);closeModal();save();go('issued');setTimeout(()=>printIssue(x.id),50)}
function saveReturn(){const issueId=document.getElementById('rIssue').value;if(!issueId)return alert('Select invoice.');const issue=data.issues.find(x=>x.id===issueId);const items=[...document.querySelectorAll('.return-qty')].map(e=>({itemId:e.dataset.item,qty:Number(e.value||0)})).filter(x=>x.qty>0);if(!items.length)return alert('Enter return quantity.');for(const q of items){if(q.qty>remaining(issueId,q.itemId))return alert('Return quantity exceeds remaining quantity.');item(q.itemId).qty+=q.qty}const amount=items.reduce((n,q)=>{const old=issue.items.find(i=>i.itemId===q.itemId);return n+Number(old?.rent||0)*q.qty*Number(old?.days||1)/100},0);data.returns.push({id:uid(),number:'RET-'+Date.now().toString().slice(-8),issueId,invoice:issue.invoice,customerId:issue.customerId,date:today(),items,amount});closeModal();save();go('returns')}
function saveShop(){const f=document.getElementById('shopImage')?.files?.[0];const apply=img=>{data.shop={...data.shop,name:document.getElementById('shopName').value.trim()||'Your Shop',owner:document.getElementById('shopOwner').value.trim(),mobile:document.getElementById('shopMobile').value.trim(),address:document.getElementById('shopAddress').value.trim(),image:img||data.shop.image||''};data.settings.currency=document.getElementById('shopCurrency').value.trim()||'₹';save();go('shop')};if(f){if(f.size>2*1024*1024)return alert('Company image must be 2 MB or smaller.');const r=new FileReader();r.onload=()=>apply(String(r.result||''));r.readAsDataURL(f)}else apply('')}
function printIssue(id){const x=data.issues.find(q=>q.id===id);if(!x)return;const w=open('','_blank');if(!w)return;w.document.write(`<html><head><title>${esc(x.invoice)}</title><style>body{font:14px Arial;padding:30px}h1{color:#006b59}table{width:100%;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid #ddd;text-align:left}.total{text-align:right;font-size:18px;font-weight:bold}</style></head><body><h1>${esc(data.shop.name)}</h1><p>${esc(data.shop.address)}<br>${esc(data.shop.mobile)}</p><h2>Rental Invoice ${esc(x.invoice)}</h2><p>Date: ${x.date}<br>Customer: ${esc(cname(x.customerId))}</p><table><tr><th>Item</th><th>Qty</th><th>Days</th><th>Rent/100</th><th>Amount</th></tr>${x.items.map(q=>`<tr><td>${esc(item(q.itemId)?.name)}</td><td>${q.qty}</td><td>${q.days}</td><td>${money(q.rent)}</td><td>${money(q.amount)}</td></tr>`).join('')}</table><p class="total">Total: ${money(x.amount)}</p><p>By PaliaAPK HUB • Developer by shanpalia</p><script>print()<\/script></body></html>`);w.document.close()}
function printReport(){const w=open('','_blank');if(!w)return;w.document.write(`<html><head><title>RentFlow Report</title><style>body{font:14px Arial;padding:30px}table{width:100%;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid #ddd;text-align:left}</style></head><body><h1>${esc(data.shop.name)} — RentFlow Report</h1><p>Generated ${today()}</p><table><tr><th>Invoice</th><th>Date</th><th>Party</th><th>Amount</th></tr>${data.issues.map(x=>`<tr><td>${esc(x.invoice)}</td><td>${x.date}</td><td>${esc(cname(x.customerId))}</td><td>${money(x.amount)}</td></tr>`).join('')}</table><script>print()<\/script></body></html>`);w.document.close()}
document.getElementById('menuBtn').onclick=()=>{const s=document.getElementById('side');s.style.display=s.style.display==='block'?'none':'block'};window.addEventListener('resize',()=>{if(innerWidth>1000)document.getElementById('side').style.display='block'});
nav();render('dashboard');
</script></body></html>
